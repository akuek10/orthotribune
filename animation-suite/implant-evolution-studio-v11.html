    // --- Error Boundary for Crash-Proof Mobile WebGL ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || '3D CAD Viewport initialization error' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="h-full w-full flex items-center justify-center bg-[#070B14] p-6 text-center">
              <div className="max-w-sm rounded-2xl border border-rose-500/30 bg-[#0F172A] p-6 shadow-2xl">

                <p className="text-xs text-slate-400 mb-4">{this.state.message}</p>

                >
                  Reload Studio
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- Procedural PBR Textures ---
    function createBrushedMetalTexture(baseHex, streakHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 420; i++) {
        const y = Math.random() * 256;
        ctx.fillStyle = i % 2 === 0 ? streakHex : 'rgba(255,255,255,0.06)';
        ctx.fillRect(0, y, 256, 1 + Math.random() * 1.5);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createPorousTrabecularTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#64748b';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 2400; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        const r = 0.8 + Math.random() * 1.6;
        ctx.fillStyle = i % 3 === 0 ? '#1e293b' : i % 3 === 1 ? '#cbd5e1' : '#94a3b8';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    function createBraidedSutureTexture(primaryHex, tracerHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = primaryHex;
      ctx.fillRect(0, 0, 128, 128);
      ctx.strokeStyle = tracerHex;
      ctx.lineWidth = 6;
      for (let i = -128; i < 256; i += 24) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i + 128, 128);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(i + 128, 0);
        ctx.lineTo(i, 128);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 12);
      return tex;
    }

    // --- Precision 3D Reverse TSA Implant Hardware Assembly (v10 Pure Hardware CAD) ---
    function buildRSAConstructCAD(genId, glenoidParams, explodeFactor) {
      const root = new THREE.Group();

      const brushedTex = createBrushedMetalTexture('#94a3b8', 'rgba(15,23,42,0.16)');
      const porousTex = createPorousTrabecularTexture();

      const tiSatMat = new THREE.MeshStandardMaterial({
        color: 0xb8c4d4,
        map: brushedTex,
        metalness: 0.85,
        roughness: 0.24
      });

      const porousTiMat = new THREE.MeshStandardMaterial({
        color: 0x8b9bb0,
        map: porousTex,
        bumpMap: porousTex,
        bumpScale: 0.016,
        metalness: 0.72,
        roughness: 0.56
      });

      const goldAugmentMat = new THREE.MeshStandardMaterial({
        color: 0xd97706,
        map: porousTex,
        bumpMap: porousTex,
        bumpScale: 0.018,
        metalness: 0.74,
        roughness: 0.45
      });

      const cocrMirrorMat = new THREE.MeshPhysicalMaterial({
        color: 0xf1f5f9,
        metalness: 0.96,
        roughness: 0.07,
        clearcoat: 0.6,
        clearcoatRoughness: 0.06
      });

      const uhmwpeMat = new THREE.MeshPhysicalMaterial({
        color: 0xf8fafc,
        emissive: 0x0284c7,
        emissiveIntensity: 0.06,
        roughness: 0.22,
        metalness: 0.02,
        clearcoat: 0.4,
        side: THREE.DoubleSide
      });

      const darkCollarMat = new THREE.MeshStandardMaterial({
        color: 0x1e293b,
        metalness: 0.85,
        roughness: 0.28
      });

      const greenScrewMat = new THREE.MeshStandardMaterial({
        color: 0x10b981,
        metalness: 0.78,
        roughness: 0.28
      });

      const purplePostMat = new THREE.MeshStandardMaterial({
        color: 0x8b5cf6,
        metalness: 0.78,
        roughness: 0.28
      });

      const exp = explodeFactor * 0.55;

      // ==========================================
      // 1. GLENOID SIDE ASSEMBLY (Left / Medial)
      // ==========================================
      const glenoidGroup = new THREE.Group();
      glenoidGroup.position.set(-0.45 - exp * 0.6, 0.1, 0);
      root.add(glenoidGroup);

      const bpRadius = genId === 'gen1' ? 0.50 : 0.44;
      const bpThick = 0.085;

      const bpGeo = new THREE.CylinderGeometry(bpRadius, bpRadius, bpThick, 40);
      bpGeo.rotateZ(-Math.PI / 2);
      const bpMesh = new THREE.Mesh(bpGeo, tiSatMat);
      glenoidGroup.add(bpMesh);

      // Posterior Half & Full Wedge Baseplate Augment (sloping thicker Anterior -> Posterior)
      const activeAugment = genId === 'gen1' ? 'flat' : glenoidParams.augmentType;
      if (activeAugment !== 'flat') {
        const isHalf = activeAugment === 'half';
        const maxWedgeDepth = 0.24;
        const minWedgeDepth = 0.03;

        const augShape = new THREE.Shape();
        if (isHalf) {
          augShape.moveTo(0, -bpRadius * 0.96);
          augShape.absarc(0, 0, bpRadius * 0.96, -Math.PI / 2, Math.PI / 2, false);
          augShape.closePath();
        } else {
          augShape.absarc(0, 0, bpRadius * 0.96, 0, Math.PI * 2, false);
        }

        const wedgeGeo = new THREE.ExtrudeGeometry(augShape, {
          depth: maxWedgeDepth,
          bevelEnabled: false,
          curveSegments: 36
        });

        wedgeGeo.rotateY(-Math.PI / 2);
        if (isHalf) {
          wedgeGeo.scale(1, 1, -1);
        }

        const pos = wedgeGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const px = pos.getX(i);
          const pz = pos.getZ(i);
          if (px < -0.001) {
            const tSlope = isHalf
              ? Math.max(0, Math.min(1, -pz / (bpRadius * 0.96)))
              : Math.max(0, Math.min(1, (bpRadius * 0.96 - pz) / (2 * bpRadius * 0.96)));
            const localDepth = minWedgeDepth + tSlope * (maxWedgeDepth - minWedgeDepth);
            pos.setX(i, -localDepth);
          }
        }
        wedgeGeo.computeVertexNormals();

        const wedgeMesh = new THREE.Mesh(wedgeGeo, goldAugmentMat);
        wedgeMesh.position.set(-bpThick / 2 - exp * 0.35, 0, 0);
        glenoidGroup.add(wedgeMesh);
      } else {
        const porousBackGeo = new THREE.CylinderGeometry(bpRadius * 0.96, bpRadius * 0.96, 0.035, 40);
        porousBackGeo.rotateZ(-Math.PI / 2);
        const porousBack = new THREE.Mesh(porousBackGeo, porousTiMat);
        porousBack.position.set(-bpThick / 2 - 0.015, 0, 0);
        glenoidGroup.add(porousBack);
      }

      // Central Fixation Post / Modular Screw
      const postLen = genId === 'gen1' ? 0.62 : 0.54;
      const postGeo = new THREE.CylinderGeometry(0.08, 0.065, postLen, 24);
      postGeo.rotateZ(-Math.PI / 2);
      const postMesh = new THREE.Mesh(postGeo, genId === 'gen3' ? purplePostMat : porousTiMat);
      postMesh.position.set(-bpThick / 2 - postLen / 2 - exp * 0.25, 0, 0);
      glenoidGroup.add(postMesh);

      if (genId !== 'gen1') {
        for (let t = 0; t < 6; t++) {
          const ringGeo = new THREE.TorusGeometry(0.082, 0.011, 10, 24);
          ringGeo.rotateY(Math.PI / 2);
          const ring = new THREE.Mesh(ringGeo, genId === 'gen3' ? purplePostMat : tiSatMat);
          ring.position.set(-0.12 - t * 0.075 - exp * 0.25, 0, 0);
          glenoidGroup.add(ring);
        }
      }

      // Peripheral Locking Screws
      const screwAngles = [Math.PI * 0.25, Math.PI * 0.75, -Math.PI * 0.25, -Math.PI * 0.75];
      screwAngles.forEach((ang, idx) => {
        const sGroup = new THREE.Group();
        const rOff = bpRadius * 0.66;
        const splay = genId === 'gen1' ? 0.05 : 0.20;
        const len = idx % 2 === 0 ? 0.64 : 0.54;

        const screwMat = genId === 'gen3' ? greenScrewMat : tiSatMat;
        const shaftGeo = new THREE.CylinderGeometry(0.035, 0.028, len, 14);
        shaftGeo.rotateZ(-Math.PI / 2);
        const shaft = new THREE.Mesh(shaftGeo, screwMat);
        shaft.position.set(-len / 2, 0, 0);
        sGroup.add(shaft);

        for (let k = 0; k < 6; k++) {
          const th = new THREE.Mesh(new THREE.TorusGeometry(0.037, 0.007, 8, 14), screwMat);
          th.rotation.set(0, Math.PI / 2, 0);
          th.position.set(-0.09 - k * 0.07, 0, 0);
          sGroup.add(th);
        }

        const headGeo = new THREE.CylinderGeometry(0.054, 0.04, 0.045, 16);
        headGeo.rotateZ(-Math.PI / 2);
        const head = new THREE.Mesh(headGeo, darkCollarMat);
        head.position.set(0.02, 0, 0);
        sGroup.add(head);

        sGroup.position.set(-exp * (0.2 + idx * 0.08), Math.cos(ang) * rOff, Math.sin(ang) * rOff);
        sGroup.rotation.set(0, Math.sin(ang) * splay, -Math.cos(ang) * splay);
        glenoidGroup.add(sGroup);
      });

      // Glenoid Lateralization Spacer
      const latMm = genId === 'gen1' ? 0 : glenoidParams.baseplateLat;
      const latThickness = latMm * 0.032;
      if (latThickness > 0.005) {
        const latGeo = new THREE.CylinderGeometry(bpRadius * 0.93, bpRadius * 0.93, latThickness, 36);
        latGeo.rotateZ(-Math.PI / 2);
        const latMesh = new THREE.Mesh(latGeo, tiSatMat);
        latMesh.position.set(bpThick / 2 + latThickness / 2 + exp * 0.35, 0, 0);
        glenoidGroup.add(latMesh);
      }

      // Glenosphere
      const isEccentric = genId !== 'gen1' && glenoidParams.eccentricSphere;
      const infOffset = isEccentric ? -0.13 : 0;
      const sphereR = genId === 'gen1' ? 0.56 : 0.62;
      const sphereX = bpThick / 2 + latThickness + 0.06 + exp * 0.75;

      const sphereGeo = new THREE.SphereGeometry(sphereR, 48, 36, 0, Math.PI * 2, 0, Math.PI * 0.62);
      sphereGeo.rotateZ(-Math.PI / 2);
      const sphereMesh = new THREE.Mesh(sphereGeo, cocrMirrorMat);
      sphereMesh.position.set(sphereX, infOffset, 0);
      glenoidGroup.add(sphereMesh);

      // ==========================================
      // 2. HUMERAL SIDE ASSEMBLY (Right / Lateral)
      // ==========================================
      const nsaDeg = genId === 'gen1' ? 155 : genId === 'gen2' ? 145 : 135;
      const nsaRad = THREE.MathUtils.degToRad(nsaDeg);

      const humeralPivot = new THREE.Group();
      humeralPivot.position.set(-0.45 + sphereX + exp * 0.55, 0.1 + infOffset, 0);
      root.add(humeralPivot);

      const cupAxisGroup = new THREE.Group();
      cupAxisGroup.rotation.set(0, 0, -(Math.PI - nsaRad));
      humeralPivot.add(cupAxisGroup);

      // White UHMWPE Polyethylene Liner
      const polyOuterR = sphereR + 0.068;
      const polyArc = Math.PI * 0.35;
      const linerGeo = new THREE.SphereGeometry(polyOuterR, 44, 28, 0, Math.PI * 2, 0, polyArc);
      linerGeo.rotateZ(-Math.PI / 2);
      const linerMesh = new THREE.Mesh(linerGeo, uhmwpeMat);
      linerMesh.position.set(0.015 + exp * 0.35, 0, 0);
      cupAxisGroup.add(linerMesh);

      const lipGeo = new THREE.TorusGeometry(polyOuterR * Math.sin(polyArc), 0.018, 12, 40);
      lipGeo.rotateY(Math.PI / 2);
      const lipMesh = new THREE.Mesh(lipGeo, uhmwpeMat);
      lipMesh.position.set(0.015 + exp * 0.35 + polyOuterR * Math.cos(polyArc), 0, 0);
      cupAxisGroup.add(lipMesh);

      const buildConcaveCupBowl = (withSutureEyelets) => {
        const cupInnerR = polyOuterR + 0.008;
        const cupOuterR = cupInnerR + 0.052;
        const bowlArc = Math.PI * 0.36;

        const bowlProfile = [];
        const segs = 24;
        for (let i = 0; i <= segs; i++) {
          const th = (i / segs) * bowlArc;
          bowlProfile.push(new THREE.Vector2(Math.sin(th) * cupInnerR, Math.cos(th) * cupInnerR));
        }
        if (withSutureEyelets) {
          bowlProfile.push(new THREE.Vector2(Math.sin(bowlArc) * (cupOuterR + 0.032), Math.cos(bowlArc) * cupInnerR));
          bowlProfile.push(new THREE.Vector2(Math.sin(bowlArc) * (cupOuterR + 0.032), Math.cos(bowlArc) * cupOuterR + 0.02));
        }
        for (let i = segs; i >= 0; i--) {
          const th = (i / segs) * bowlArc;
          const rOut = Math.max(0.20, Math.sin(th) * cupOuterR);
          bowlProfile.push(new THREE.Vector2(rOut, Math.cos(th) * cupOuterR));
        }

        const cupGeo = new THREE.LatheGeometry(bowlProfile, 48);
        cupGeo.rotateZ(-Math.PI / 2);

        const cGroup = new THREE.Group();
        cGroup.add(new THREE.Mesh(cupGeo, tiSatMat));

        if (withSutureEyelets) {
          const rimX = Math.cos(bowlArc) * (cupInnerR + 0.01);
          const rimR = Math.sin(bowlArc) * (cupOuterR + 0.012);
          for (let e = 0; e < 8; e++) {
            const ang = (e / 8) * Math.PI * 2;
            const holeDot = new THREE.Mesh(
              new THREE.CylinderGeometry(0.020, 0.020, 0.06, 12).rotateZ(-Math.PI / 2),
              darkCollarMat
            );
            holeDot.position.set(rimX, Math.cos(ang) * rimR, Math.sin(ang) * rimR);
            cGroup.add(holeDot);
          }
        }
        return { cGroup, cupOuterR };
      };

      if (genId === 'gen1') {
        // Gen 1: Medialized Grammont 155° Inlay Stem
        const { cGroup, cupOuterR } = buildConcaveCupBowl(false);
        cGroup.position.set(0.015 + exp * 0.85, 0, 0);
        cupAxisGroup.add(cGroup);

        const stemGroup = new THREE.Group();
        stemGroup.position.set(cupOuterR + exp * 0.85, 0, 0);

        cupAxisGroup.add(stemGroup);

        const metaBridge = new THREE.Mesh(
          new THREE.CylinderGeometry(0.32, 0.17, 0.48, 32),
          tiSatMat
        );
        metaBridge.position.set(-0.04, -0.22, 0);
        stemGroup.add(metaBridge);

        const finGeo = new THREE.BoxGeometry(0.24, 0.44, 0.045);
        const finMesh = new THREE.Mesh(finGeo, tiSatMat);
        finMesh.position.set(0.14, -0.18, 0);
        stemGroup.add(finMesh);

        const stemGeo = new THREE.CylinderGeometry(0.17, 0.10, 1.95, 28);
        const stemMesh = new THREE.Mesh(stemGeo, cocrMirrorMat);
        stemMesh.position.set(-0.04, -1.42, 0);
        stemGroup.add(stemMesh);
      } else if (genId === 'gen2') {
        // Gen 2: Lateralized 145° Proud Onlay Tray + Curved Metaphyseal Stem
        const trayX = polyOuterR + 0.02 + exp * 0.85;
        const trayTop = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.53, 0.085, 36).rotateZ(-Math.PI / 2), tiSatMat);
        trayTop.position.set(trayX, 0, 0);
        cupAxisGroup.add(trayTop);

        const trayBase = new THREE.Mesh(new THREE.CylinderGeometry(0.50, 0.46, 0.085, 36).rotateZ(-Math.PI / 2), darkCollarMat);
        trayBase.position.set(trayX + 0.085, 0, 0);

        const osteotomyPlaneX = trayX + 0.128;

        const stemGroup = new THREE.Group();

        const curve = new THREE.CatmullRomCurve3([

      } else {

        cupAxisGroup.add(cGroup);

        const stemGroup = new THREE.Group();

        const metaShape = new THREE.Shape();

      return { root, humeralPivot };
    }

    // --- Precision 3D Suture Anchor Evolution CAD Builder ---
    function buildSutureAnchorCAD(anchorGenId, deploymentPct) {
      const root = new THREE.Group();

      const brushedTex = createBrushedMetalTexture('#cbd5e1', 'rgba(15,23,42,0.18)');
      const sutureBlueTex = createBraidedSutureTexture('#0284c7', '#f8fafc');
      const sutureWhiteTex = createBraidedSutureTexture('#f1f5f9', '#38bdf8');

      const tiMat = new THREE.MeshStandardMaterial({
        color: 0xcbd5e1,
        map: brushedTex,
        metalness: 0.88,
        roughness: 0.22
      });

      const peekMat = new THREE.MeshPhysicalMaterial({
        color: 0xd6c7b2,
        roughness: 0.34,
        metalness: 0.05,
        clearcoat: 0.25
      });

      const biocompMat = new THREE.MeshPhysicalMaterial({
        color: 0xf8fafc,
        roughness: 0.28,
        metalness: 0.02,
        clearcoat: 0.35
      });

      const blueBraidMat = new THREE.MeshStandardMaterial({
        map: sutureBlueTex,
        roughness: 0.65,
        metalness: 0.05
      });

      const whiteBraidMat = new THREE.MeshStandardMaterial({
        map: sutureWhiteTex,
        roughness: 0.65,
        metalness: 0.05
      });

      const boneShellMat = new THREE.MeshPhysicalMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.14,
        roughness: 0.3,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      const cortexSlab = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.18, 2.2), boneShellMat);
      cortexSlab.position.set(0, 0.55, 0);
      root.add(cortexSlab);

      const cortexEdges = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(2.6, 0.18, 2.2)),
        new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45 })
      );
      cortexEdges.position.set(0, 0.55, 0);
      root.add(cortexEdges);

      const cancellousBox = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(2.6, 1.85, 2.2)),
        new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.65 })
      );
      cancellousBox.position.set(0, -0.46, 0);
      root.add(cancellousBox);

      const t = deploymentPct / 100;
      const yOffset = (1 - Math.min(1, t * 1.35)) * 1.15;

      const anchorGroup = new THREE.Group();
      anchorGroup.position.set(0, yOffset, 0);
      root.add(anchorGroup);

      const holeRadius = anchorGenId === 'ti' ? 0.44 : (anchorGenId === 'peek' || anchorGenId === 'biocomp') ? 0.37 : 0.13;
      const pilotRing = new THREE.Mesh(
        new THREE.RingGeometry(holeRadius, holeRadius + 0.025, 40),
        new THREE.MeshBasicMaterial({ color: anchorGenId === 'allsuture' ? 0x10b981 : 0x38bdf8, side: THREE.DoubleSide })
      );
      pilotRing.rotation.set(-Math.PI / 2, 0, 0);
      pilotRing.position.set(0, 0.645, 0);
      root.add(pilotRing);

      if (anchorGenId === 'ti' || anchorGenId === 'peek' || anchorGenId === 'biocomp') {
        const bodyMat = anchorGenId === 'ti' ? tiMat : anchorGenId === 'peek' ? peekMat : biocompMat;
        const outerR = anchorGenId === 'ti' ? 0.34 : 0.29;
        const coreR = outerR * 0.68;
        const bodyLen = 1.48;

        const coreGeo = new THREE.CylinderGeometry(coreR, coreR * 0.42, bodyLen, 32);
        const coreMesh = new THREE.Mesh(coreGeo, bodyMat);
        coreMesh.position.set(0, -0.14, 0);
        anchorGroup.add(coreMesh);

        const tipGeo = new THREE.ConeGeometry(coreR * 0.42, 0.22, 32);
        tipGeo.rotateX(Math.PI);
        const tipMesh = new THREE.Mesh(tipGeo, bodyMat);
        tipMesh.position.set(0, -0.14 - bodyLen / 2 - 0.11, 0);
        anchorGroup.add(tipMesh);

        const helixPts = [];
        const turns = 6.5;
        const samples = 140;
        for (let i = 0; i <= samples; i++) {
          const frac = i / samples;
          const ang = frac * turns * Math.PI * 2;
          const yy = 0.52 - frac * (bodyLen - 0.08);
          const taper = 1 - Math.pow(frac, 2.2) * 0.52;
          const rr = outerR * taper;
          helixPts.push(new THREE.Vector3(Math.cos(ang) * rr, yy, Math.sin(ang) * rr));
        }
        const helixCurve = new THREE.CatmullRomCurve3(helixPts);
        const threadGeo = new THREE.TubeGeometry(helixCurve, 140, anchorGenId === 'ti' ? 0.044 : 0.038, 10, false);
        const threadMesh = new THREE.Mesh(threadGeo, bodyMat);
        anchorGroup.add(threadMesh);

        if (anchorGenId !== 'ti') {
          for (let v = 0; v < 3; v++) {
            const vent = new THREE.Mesh(
              new THREE.CylinderGeometry(0.055, 0.055, coreR * 2.1, 14),
              new THREE.MeshBasicMaterial({ color: 0x070B14 })
            );
            vent.rotation.set(0, (v * Math.PI) / 3, Math.PI / 2);
            vent.position.set(0, 0.18 - v * 0.34, 0);
            anchorGroup.add(vent);
          }
        }

        const headCap = new THREE.Mesh(new THREE.CylinderGeometry(coreR * 1.05, coreR, 0.12, 28), bodyMat);
        headCap.position.set(0, 0.58, 0);
        anchorGroup.add(headCap);

        [-0.08, 0.08].forEach((xOff, sIdx) => {
          const mat = sIdx === 0 ? blueBraidMat : whiteBraidMat;
          [-1, 1].forEach((dir) => {
            const sCurve = new THREE.CatmullRomCurve3([
              new THREE.Vector3(xOff, 0.54, 0),
              new THREE.Vector3(xOff + dir * 0.16, 0.85, dir * 0.08),
              new THREE.Vector3(xOff + dir * 0.52, 1.18, dir * 0.22)
            ]);
            const sGeo = new THREE.TubeGeometry(sCurve, 20, 0.024, 8, false);
            anchorGroup.add(new THREE.Mesh(sGeo, mat));
          });
        });

        if (anchorGenId === 'ti') {
          const artifactMat = new THREE.MeshBasicMaterial({
            color: 0x94a3b8,
            wireframe: true,
            transparent: true,
            opacity: 0.16
          });
          const artifactSphere = new THREE.Mesh(new THREE.SphereGeometry(1.12, 16, 12), artifactMat);
          artifactSphere.position.set(0, -0.1, 0);
          anchorGroup.add(artifactSphere);
        }
      } else {
        const bunchFactor = Math.max(0, (t - 0.35) / 0.65);

        const neckGeo = new THREE.CylinderGeometry(0.065, 0.065, 0.42, 16);
        const neckMesh = new THREE.Mesh(neckGeo, blueBraidMat);
        neckMesh.position.set(0, 0.52, 0);
        anchorGroup.add(neckMesh);

        const ballPts = [];
        const loops = 18;
        const totalSamples = 220;
        for (let i = 0; i <= totalSamples; i++) {
          const frac = i / totalSamples;
          const ang = frac * loops * Math.PI * 2;
          const height = 1.35 * (1 - bunchFactor * 0.66);
          const centerY = -0.15 + bunchFactor * 0.35;
          const yy = centerY + (0.5 - frac) * height;
          const profile = Math.sin(frac * Math.PI);
          const rr = 0.09 + bunchFactor * 0.33 * Math.pow(profile, 0.65) + Math.sin(frac * loops * Math.PI) * 0.025;
          ballPts.push(new THREE.Vector3(Math.cos(ang) * rr, yy, Math.sin(ang) * rr));
        }
        const sleeveCurve = new THREE.CatmullRomCurve3(ballPts);
        const sleeveGeo = new THREE.TubeGeometry(sleeveCurve, 220, 0.036, 8, false);
        const sleeveMesh = new THREE.Mesh(sleeveGeo, blueBraidMat);
        anchorGroup.add(sleeveMesh);

        [-0.04, 0.04].forEach((xOff, idx) => {
          const mat = idx === 0 ? whiteBraidMat : blueBraidMat;
          const sCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(xOff, 0.25, 0),
            new THREE.Vector3(xOff, 0.68, 0),
            new THREE.Vector3(xOff + (idx === 0 ? -0.45 : 0.45), 1.15, idx === 0 ? 0.18 : -0.18)
          ]);
          const sGeo = new THREE.TubeGeometry(sCurve, 24, 0.022, 8, false);
          anchorGroup.add(new THREE.Mesh(sGeo, mat));
        });
      }

      return root;
    }

    function App() {
      const [navOpen, setNavOpen] = useState(false);
      const [previewModule, setPreviewModule] = useState(null);
      const [domain, setDomain] = useState('rsa');

      // Reverse TSA State
      const [rsaGenId, setRsaGenId] = useState('gen3');
      const [glenoidParams, setGlenoidParams] = useState({
        baseplateLat: 6,
        augmentType: 'half',
        eccentricSphere: true
      });
      const [explodeFactor, setExplodeFactor] = useState(0.0);
      const [cameraPreset, setCameraPreset] = useState('iso');

      // Suture Anchor State (Play/Pause only used for All-Suture bunch-up effect)
      const [anchorGenId, setAnchorGenId] = useState('allsuture');
      const [deploymentPct, setDeploymentPct] = useState(100);
      const [isAnchorPlaying, setIsAnchorPlaying] = useState(true);

      const activeRsaGen = useMemo(() => RSA_GENERATIONS.find((g) => g.id === rsaGenId) || RSA_GENERATIONS[2], [rsaGenId]);
      const activeAnchorGen = useMemo(() => ANCHOR_GENERATIONS.find((g) => g.id === anchorGenId) || ANCHOR_GENERATIONS[3], [anchorGenId]);

      const selectRsaGeneration = (gen) => {
        setRsaGenId(gen.id);
        setGlenoidParams({ ...gen.defaults });
        setExplodeFactor(0);
      };

      const selectAnchorGeneration = (gen) => {
        setAnchorGenId(gen.id);
        setDeploymentPct(100);
        setIsAnchorPlaying(gen.id === 'allsuture');
      };

      // Recover WebGL canvas when returning via browser Back button (bfcache) or GPU context loss
      useEffect(() => {
        const handlePageShow = (event) => {
          if (event.persisted) {
            window.location.reload();
          }
        };
        const handleContextLost = (event) => {
          event.preventDefault();
          window.location.reload();
        };
        window.addEventListener('pageshow', handlePageShow);
        const canvas = mountRef.current?.querySelector('canvas');
        if (canvas) {
          canvas.addEventListener('webglcontextlost', handleContextLost);
        }
        return () => {
          window.removeEventListener('pageshow', handlePageShow);
          if (canvas) {
            canvas.removeEventListener('webglcontextlost', handleContextLost);
          }
        };
      }, []);

      // --- Three.js Scene Setup ---
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const animStateRef = useRef({ domain, anchorGenId, isAnchorPlaying });

      useEffect(() => {
        animStateRef.current = { domain, anchorGenId, isAnchorPlaying };
      }, [domain, anchorGenId, isAnchorPlaying]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        } catch (err) {
          return;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);
        rendererRef.current = renderer;

        const scene = new THREE.Scene();
        sceneRef.current = scene;

        const camera = new THREE.PerspectiveCamera(34, container.clientWidth / container.clientHeight, 0.1, 100);
        cameraRef.current = camera;

        scene.add(new THREE.AmbientLight(0xe2e8f0, 1.15));

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
        keyLight.position.set(4, 7, 6);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.9);
        fillLight.position.set(-6, 2, 4);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xf59e0b, 0.65);
        rimLight.position.set(0, -5, -5);
        scene.add(rimLight);

        const grid = new THREE.GridHelper(6, 24, 0x1e293b, 0x0f172a);
        grid.position.set(0, -1.65, 0);
        scene.add(grid);

        let isDragging = false;
        let prevX = 0;
        let prevY = 0;
        let spherical = { theta: 0.42, phi: Math.PI / 2 - 0.18, radius: 4.3 };

        const updateCam = () => {
          spherical.phi = Math.max(0.18, Math.min(Math.PI - 0.18, spherical.phi));
          spherical.radius = Math.max(1.8, Math.min(8.5, spherical.radius));
          const x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
          const y = spherical.radius * Math.cos(spherical.phi);
          const z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
          camera.position.set(x, y, z);
          camera.lookAt(0, -0.05, 0);
        };
        updateCam();

        camera.userData.setSpherical = (theta, phi, radius) => {
          spherical = { theta, phi, radius };
          updateCam();
        };

        const onPointerDown = (e) => {
          isDragging = true;
          prevX = e.clientX;
          prevY = e.clientY;
        };
        const onPointerMove = (e) => {
          if (!isDragging) return;
          const dx = e.clientX - prevX;
          const dy = e.clientY - prevY;
          prevX = e.clientX;
          prevY = e.clientY;
          spherical.theta -= dx * 0.008;
          spherical.phi -= dy * 0.008;
          updateCam();
        };
        const onPointerUp = () => { isDragging = false; };
        const onWheel = (e) => {
          e.preventDefault();
          spherical.radius += e.deltaY * 0.003;
          updateCam();
        };

        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        dom.addEventListener('wheel', onWheel, { passive: false });

        const onResize = () => {
          if (!container || !renderer || !camera) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', onResize);

        let animId;
        let clock = 0;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          const st = animStateRef.current;

          if (st.domain === 'anchor' && st.anchorGenId === 'allsuture' && st.isAnchorPlaying) {
            clock += 0.022;
            const cycle = (Math.sin(clock * 0.85) + 1) / 2;
            const pct = Math.min(100, Math.round(25 + cycle * 90));
            setDeploymentPct(pct);
          }

          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          dom.removeEventListener('pointerdown', onPointerDown);
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
          dom.removeEventListener('wheel', onWheel);
          window.removeEventListener('resize', onResize);
          renderer.dispose();
          if (container.contains(dom)) container.removeChild(dom);
        };
      }, []);

      // Rebuild CAD Assembly on Parameter Change
      useEffect(() => {
        const scene = sceneRef.current;
        if (!scene) return;

        const toRemove = [];
        scene.children.forEach((c) => {
          if (c.userData.isCADAssembly) toRemove.push(c);
        });
        toRemove.forEach((o) => scene.remove(o));

        if (domain === 'rsa') {
          const { root } = buildRSAConstructCAD(
            rsaGenId,
            glenoidParams,
            explodeFactor
          );
          root.userData.isCADAssembly = true;
          scene.add(root);
        } else {
          const anchorRoot = buildSutureAnchorCAD(anchorGenId, deploymentPct);
          anchorRoot.userData.isCADAssembly = true;
          scene.add(anchorRoot);
        }
      }, [domain, rsaGenId, glenoidParams, explodeFactor, anchorGenId, deploymentPct]);

      const handleCameraPreset = (preset) => {
        setCameraPreset(preset);
        const cam = cameraRef.current;
        if (!cam || !cam.userData.setSpherical) return;
        if (preset === 'iso') cam.userData.setSpherical(0.42, Math.PI / 2 - 0.18, 4.3);
        else if (preset === 'front') cam.userData.setSpherical(0.0, Math.PI / 2, 4.1);
        else if (preset === 'glenoid') cam.userData.setSpherical(-0.92, Math.PI / 2 - 0.14, 3.2);
        else if (preset === 'top') cam.userData.setSpherical(0.0, 0.22, 3.8);
      };

      return (
        <div className="h-full w-full flex flex-col lg:flex-row bg-[#070B14] text-slate-100 select-none overflow-hidden">

          {/* --- OrthoTribune Slide-Over Navigation Drawer (Matching RSA Construct Studio Format) --- */}
          {navOpen && (
            <div className="fixed inset-0 z-50 flex">
              <div
                className="fixed inset-0 bg-black/70 backdrop-blur-xs"
                onClick={() => setNavOpen(false)}
              />
              <aside className="relative z-10 w-80 max-w-[86vw] h-full bg-[#0B1120] border-r border-slate-800 flex flex-col overflow-y-auto shadow-2xl">
                <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                  <div>
                    <div className="text-sm font-bold tracking-wider text-white">
                      ORTHO<span className="text-sky-400">TRIBUNE</span>
                    </div>
                    <div className="text-[11px] text-slate-400">Clinical Evidence & VAC Intelligence</div>
                  </div>
                  <button
                    onClick={() => setNavOpen(false)}
                    className="p-2 rounded-lg bg-slate-800/80 text-slate-300 hover:text-white"
                    aria-label="Close Menu"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <div className="p-3 border-b border-slate-800/80">
                  <a
                    href="/"
                    className="flex items-center justify-between w-full px-3.5 py-2.5 rounded-xl bg-sky-500/15 border border-sky-500/30 text-sky-300 hover:bg-sky-500/25 text-xs font-semibold transition"
                  >
                    <span>← Back to OrthoTribune.com</span>
                    <ExternalLink className="w-3.5 h-3.5" />
                  </a>
                </div>

                <div className="p-3 border-b border-slate-800/80">
                  <div className="px-2 pb-2 text-[10px] font-bold uppercase tracking-widest text-sky-400">
                    Animation Suite Studios
                  </div>
                  <div className="space-y-1.5">
                    {ANIMATION_SUITE_MODULES.map((mod) => {
                      const isCurrent = mod.id === 'implant-evolution';
                      const isLiveLink = mod.status === 'ACTIVE' && mod.href;

                      if (isLiveLink) {
                        return (
                          <a
                            key={mod.id}
                            href={mod.href}
                            className="block w-full text-left p-2.5 rounded-xl border bg-slate-900/60 border-slate-800/80 text-slate-300 hover:border-sky-500/40 hover:text-white transition"
                          >
                            <div className="flex items-center justify-between gap-2 mb-0.5">
                              <span className="text-xs font-semibold leading-tight">{mod.title}</span>
                              <span className="shrink-0 px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                                {mod.status}
                              </span>
                            </div>
                            <div className="text-[11px] text-slate-400">{mod.tag}</div>
                          </a>
                        );
                      }

                      return (
                        <button
                          key={mod.id}
                          onClick={() => {
                            if (isCurrent) {
                              setPreviewModule(null);
                              setNavOpen(false);
                            } else {
                              setPreviewModule(mod);
                              setNavOpen(false);
                            }
                          }}
                          className={`w-full text-left p-2.5 rounded-xl border transition ${
                            isCurrent
                              ? 'bg-sky-500/15 border-sky-500/40 text-white'
                              : 'bg-slate-900/60 border-slate-800/80 text-slate-300 hover:border-slate-700'
                          }`}
                        >
                          <div className="flex items-center justify-between gap-2 mb-0.5">
                            <span className="text-xs font-semibold leading-tight">{mod.title}</span>
                            <span
                              className={`shrink-0 px-1.5 py-0.5 rounded text-[9px] font-bold ${
                                isCurrent
                                  ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                                  : 'bg-slate-800 text-slate-400'
                              }`}
                            >
                              {isCurrent ? 'ACTIVE' : mod.status}
                            </span>
                          </div>
                          <div className="text-[11px] text-slate-400">{mod.tag}</div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="p-3 flex-1">
                  <div className="px-2 pb-2 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                    OrthoTribune Sections
                  </div>
                  <div className="space-y-1">
                    {ORTHOTRIBUNE_PORTAL_LINKS.map((item) => {
                      const IconComp = item.icon;
                      return (
                        <a
                          key={item.id}
                          href={item.href}
                          className="flex items-center gap-3 p-2.5 rounded-xl hover:bg-slate-800/70 transition group"
                        >
                          <div className="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 group-hover:text-sky-400">
                            <IconComp className="w-4 h-4" />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="text-xs font-medium text-slate-200 group-hover:text-white">{item.label}</div>
                            <div className="text-[10px] text-slate-500 truncate">{item.desc}</div>
                          </div>
                          <ChevronRight className="w-3.5 h-3.5 text-slate-600 group-hover:text-slate-300" />
                        </a>
                      );
                    })}
                  </div>
                </div>
              </aside>
            </div>
          )}

          {/* --- Mobile Portrait Top Header Bar --- */}
          <header className="lg:hidden shrink-0 h-11 px-2.5 bg-[#0B1120] border-b border-slate-800/90 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2 min-w-0">
              <button
                onClick={() => setNavOpen(true)}
                className="p-2 rounded-lg bg-slate-800/90 border border-slate-700/80 text-slate-200 active:scale-95 transition"
                aria-label="Open OrthoTribune Menu"
              >
                <Menu className="w-4 h-4" />
              </button>
              <div className="truncate">
                <span className="text-xs font-bold tracking-wide text-white">IMPLANT EVOLUTION STUDIO</span>
              </div>
            </div>

            <div className="flex items-center gap-1 bg-slate-950 p-0.5 rounded-lg border border-slate-800 shrink-0">
              <button
                onClick={() => { setDomain('rsa'); handleCameraPreset('iso'); }}
                className={`px-2 py-1 rounded text-[10px] font-bold transition ${
                  domain === 'rsa' ? 'bg-sky-500 text-slate-950' : 'text-slate-400'
                }`}
              >
                Reverse TSA
              </button>
              <button
                onClick={() => { setDomain('anchor'); handleCameraPreset('iso'); }}
                className={`px-2 py-1 rounded text-[10px] font-bold transition ${
                  domain === 'anchor' ? 'bg-sky-500 text-slate-950' : 'text-slate-400'
                }`}
              >
                Suture Anchors
              </button>
            </div>
          </header>

          {/* --- Left / Top: 3D Hardware CAD Viewport --- */}
          <section className="relative w-full h-[46%] lg:h-full lg:w-[60%] xl:w-[63%] bg-gradient-to-b from-[#070B14] via-[#0A1120] to-[#070B14] border-b lg:border-b-0 lg:border-r border-slate-800/90 flex flex-col">

            {/* Desktop Top Bar */}
            <div className="hidden lg:flex items-center justify-between gap-3 px-4 py-3 border-b border-slate-800/70 bg-[#0B1120]/80 backdrop-blur-md z-10">
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setNavOpen(true)}
                  className="p-2.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-slate-200 transition"
                  title="OrthoTribune Navigation & Animation Suite"
                >
                  <Menu className="w-4 h-4" />
                </button>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-sm font-bold tracking-wide text-white">IMPLANT ENGINEERING EVOLUTION STUDIO</h1>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-sky-500/15 text-sky-300 border border-sky-500/30">
                      OrthoTribune Animation Suite
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400">
                    {domain === 'rsa'
                      ? 'Reverse Shoulder Arthroplasty: Grammont 155° → Bone-Sparing Lateralized & Augmented Constructs'
                      : 'Suture Anchors: Titanium & Polymer Designs → Subcortical All-Suture Deployment'}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button
                  onClick={() => { setDomain('rsa'); handleCameraPreset('iso'); }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                    domain === 'rsa' ? 'bg-sky-500 text-slate-950' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  1. Reverse TSA Evolution
                </button>
                <button
                  onClick={() => { setDomain('anchor'); handleCameraPreset('iso'); }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                    domain === 'anchor' ? 'bg-sky-500 text-slate-950' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  2. Suture Anchor Evolution
                </button>
              </div>
            </div>

            {/* Upcoming Studio Preview Banner */}
            {previewModule && (
              <div className="mx-3 mt-2.5 p-3 rounded-xl bg-[#0F172A]/95 border border-sky-500/40 shadow-xl z-20 flex items-start justify-between gap-3">
                <div>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 text-[10px] font-bold">
                      UPCOMING STUDIO ARCHITECTURE
                    </span>
                    <span className="text-xs font-bold text-white">{previewModule.title}</span>
                  </div>
                  <p className="text-[11px] text-slate-300 mb-1.5">{previewModule.summary}</p>
                  <div className="flex flex-wrap gap-1.5">
                    {previewModule.parameters.map((p) => (
                      <span key={p} className="px-2 py-0.5 rounded bg-slate-800 text-[10px] text-slate-300 border border-slate-700">
                        {p}
                      </span>
                    ))}
                  </div>
                </div>
                <button
                  onClick={() => setPreviewModule(null)}
                  className="p-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white shrink-0"
                >
                  <X className="w-4 h-4" />
                </button>
              </div>
            )}

            {/* Camera Angle Bar */}
            <div className="px-2.5 py-1.5 flex items-center justify-between gap-2 z-10 overflow-x-auto no-scrollbar">
              <div className="flex items-center gap-1 shrink-0">
                {[
                  { id: 'iso', label: '3D Isometric' },
                  { id: 'front', label: 'Coronal / AP' },
                  { id: 'glenoid', label: domain === 'rsa' ? 'Posterior Wedge' : 'Subcortical Shelf' },
                  { id: 'top', label: domain === 'rsa' ? 'Axial (Ant → Post)' : 'Footprint View' }
                ].map((cam) => (
                  <button
                    key={cam.id}
                    onClick={() => handleCameraPreset(cam.id)}
                    className={`px-2.5 py-1 rounded-lg text-[11px] font-medium transition ${
                      cameraPreset === cam.id
                        ? 'bg-sky-500 text-slate-950 font-semibold'
                        : 'bg-slate-900/85 text-slate-300 border border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    {cam.label}
                  </button>
                ))}
              </div>

              <span className="text-[10px] font-semibold text-sky-300 bg-sky-500/10 border border-sky-500/30 px-2.5 py-1 rounded-lg shrink-0">
                {domain === 'rsa' ? activeRsaGen.era : activeAnchorGen.era}
              </span>
            </div>

            {/* 3D Hardware CAD Canvas */}
            <div ref={mountRef} className="flex-1 w-full min-h-0 cursor-grab active:cursor-grabbing" />

            {/* Bottom Viewport Controls (Exploded View for RSA / Bunch-Up Animation for All-Suture Anchor) */}
            <div className="px-3 py-2 bg-[#0B1120]/90 border-t border-slate-800/80 flex items-center gap-3 z-10">
              {domain === 'rsa' ? (
                <div className="flex-1 min-w-0">
                  <div className="flex justify-between text-[10px] mb-0.5">
                    <span className="uppercase font-semibold text-slate-400 truncate">Modular Exploded View</span>
                    <span className="font-bold text-sky-300">{Math.round(explodeFactor * 100)}%</span>
                  </div>
                  <input
                    type="range"
                    min={0}
                    max={1}
                    step={0.02}
                    value={explodeFactor}
                    onChange={(e) => setExplodeFactor(Number(e.target.value))}
                    className="w-full h-1.5 bg-slate-800 rounded-lg accent-sky-400 cursor-pointer"
                  />
                </div>
              ) : (
                <>
                  {anchorGenId === 'allsuture' && (
                    <button
                      onClick={() => setIsAnchorPlaying((v) => !v)}
                      className="p-2 rounded-lg bg-sky-600 hover:bg-sky-500 text-white shrink-0 transition"
                      aria-label={isAnchorPlaying ? 'Pause Bunch-Up Animation' : 'Play Bunch-Up Animation'}
                      title={isAnchorPlaying ? 'Pause Subcortical Bunch-Up' : 'Play Subcortical Bunch-Up'}
                    >
                      {isAnchorPlaying ? <Pause className="w-3.5 h-3.5" /> : <Play className="w-3.5 h-3.5" />}
                    </button>
                  )}

                  <div className="flex-1 min-w-0">
                    <div className="flex justify-between text-[10px] mb-0.5">
                      <span className="uppercase font-semibold text-slate-400">
                        {anchorGenId === 'allsuture' ? 'Subcortical Ball Bunch-Up Deployment' : 'Cortical Thread Insertion'}
                      </span>
                      <span className="font-bold text-emerald-300">{deploymentPct}%</span>
                    </div>
                    <input
                      type="range"
                      min={0}
                      max={100}
                      value={deploymentPct}
                      onChange={(e) => {
                        setIsAnchorPlaying(false);
                        setDeploymentPct(Number(e.target.value));
                      }}
                      className="w-full h-1.5 bg-slate-800 rounded-lg accent-emerald-400 cursor-pointer"
                    />
                  </div>
                </>
              )}
            </div>
          </section>

          {/* --- Right / Bottom: Generation Timeline, Modular Controls & Concise Specs --- */}
          <section className="flex-1 lg:h-full lg:w-[40%] xl:w-[37%] flex flex-col bg-[#0B1120] overflow-hidden">

            {/* Generation Timeline Stepper */}
            <div className="p-3 bg-slate-900/90 border-b border-slate-800 shrink-0">
              <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">
                {domain === 'rsa' ? 'Reverse TSA Design Generation' : 'Suture Anchor Generation'}
              </div>

              {domain === 'rsa' ? (
                <div className="grid grid-cols-3 gap-1.5">
                  {RSA_GENERATIONS.map((g, idx) => (
                    <button
                      key={g.id}
                      onClick={() => selectRsaGeneration(g)}
                      className={`p-2 rounded-xl border text-left transition min-h-[50px] ${
                        rsaGenId === g.id
                          ? 'bg-sky-500/15 border-sky-400 text-white'
                          : 'bg-slate-950/70 border-slate-800 text-slate-400 hover:border-slate-700'
                      }`}
                    >
                      <div className="text-[9px] font-bold text-sky-400">GEN {idx + 1}</div>
                      <div className="text-[11px] font-bold leading-tight mt-0.5">
                        {idx === 0 ? 'Grammont 155°' : idx === 1 ? 'Lateral Onlay' : '135° SutureCup'}
                      </div>
                    </button>
                  ))}
                </div>
              ) : (
                <div className="grid grid-cols-4 gap-1.5">
                  {ANCHOR_GENERATIONS.map((g, idx) => (
                    <button
                      key={g.id}
                      onClick={() => selectAnchorGeneration(g)}
                      className={`p-2 rounded-xl border text-left transition min-h-[50px] ${
                        anchorGenId === g.id
                          ? 'bg-sky-500/15 border-sky-400 text-white'
                          : 'bg-slate-950/70 border-slate-800 text-slate-400 hover:border-slate-700'
                      }`}
                    >
                      <div className="text-[9px] font-bold text-sky-400">GEN {idx + 1}</div>
                      <div className="text-[11px] font-bold leading-tight mt-0.5">
                        {idx === 0 ? 'Titanium' : idx === 1 ? 'PEEK' : idx === 2 ? 'Biocomp' : 'All-Suture'}
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* Scrollable Engineering Breakdown & Interactive Modifiers */}
            <div className="flex-1 overflow-y-auto p-3.5 space-y-3.5">

              {domain === 'rsa' ? (
                <>
                  <div>
                    <h2 className="text-sm font-bold text-white">{activeRsaGen.title}</h2>
                    <p className="text-[11px] text-sky-300 font-medium">{activeRsaGen.subtitle}</p>
                  </div>

                  {/* Glenoid Modularity Controls */}
                  <div className="p-3 rounded-xl bg-slate-900/85 border border-slate-800 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-bold text-slate-200">Glenoid Modularity</span>
                      {rsaGenId === 'gen1' && (
                        <span className="text-[10px] text-slate-400">Fixed in Gen 1</span>
                      )}
                    </div>

                    {/* Glenoid Baseplate Lateralization */}
                    <div>
                      <div className="flex justify-between text-[10px] text-slate-400 mb-1">
                        <span>Baseplate Lateralization</span>
                        <span className="text-sky-300 font-bold">
                          +{rsaGenId === 'gen1' ? 0 : glenoidParams.baseplateLat} mm
                        </span>
                      </div>
                      <div className="grid grid-cols-4 gap-1.5">
                        {[0, 3, 6, 9].map((mm) => (
                          <button
                            key={mm}
                            disabled={rsaGenId === 'gen1'}
                            onClick={() => setGlenoidParams((p) => ({ ...p, baseplateLat: mm }))}
                            className={`py-1.5 rounded-lg border text-xs font-bold min-h-[38px] transition ${
                              (rsaGenId === 'gen1' ? mm === 0 : glenoidParams.baseplateLat === mm)
                                ? 'bg-sky-500/20 border-sky-400 text-white'
                                : 'bg-slate-950 border-slate-800 text-slate-400 disabled:opacity-40'
                            }`}
                          >
                            +{mm}mm
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Posterior Half vs Full Augment Baseplate */}
                    <div>
                      <div className="flex justify-between text-[10px] text-slate-400 mb-1">
                        <span>Posterior Wedge Augment</span>
                        <span className="text-amber-300 font-bold">
                          {rsaGenId === 'gen1'
                            ? 'Flat'
                            : glenoidParams.augmentType === 'half'
                              ? 'Posterior Half-Wedge (Ant → Post Slope)'
                              : glenoidParams.augmentType === 'full'
                                ? 'Full-Wedge (Ant → Post Slope)'
                                : 'Flat Baseplate'}
                        </span>
                      </div>
                      <div className="grid grid-cols-3 gap-1.5">
                        {[
                          { id: 'flat', label: 'Flat' },
                          { id: 'half', label: 'Half Augment' },
                          { id: 'full', label: 'Full Augment' }
                        ].map((aug) => (
                          <button
                            key={aug.id}
                            disabled={rsaGenId === 'gen1'}
                            onClick={() => {
                              setGlenoidParams((p) => ({ ...p, augmentType: aug.id }));
                              handleCameraPreset('top');
                            }}
                            className={`py-1.5 px-1.5 rounded-lg border text-[11px] font-semibold min-h-[38px] transition ${
                              (rsaGenId === 'gen1' ? aug.id === 'flat' : glenoidParams.augmentType === aug.id)
                                ? 'bg-amber-500/20 border-amber-400 text-amber-200'
                                : 'bg-slate-950 border-slate-800 text-slate-400 disabled:opacity-40'
                            }`}
                          >
                            {aug.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Eccentric Glenosphere Toggle */}
                    <div className="flex items-center justify-between pt-0.5">
                      <div>
                        <div className="text-[11px] font-semibold text-slate-200">Eccentric Glenosphere</div>
                        <div className="text-[10px] text-slate-400">+4 mm inferior overhang</div>
                      </div>
                      <button
                        disabled={rsaGenId === 'gen1'}
                        onClick={() => setGlenoidParams((p) => ({ ...p, eccentricSphere: !p.eccentricSphere }))}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold border min-h-[38px] transition ${
                          (rsaGenId !== 'gen1' && glenoidParams.eccentricSphere)
                            ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300'
                            : 'bg-slate-950 border-slate-800 text-slate-400 disabled:opacity-40'
                        }`}
                      >
                        {(rsaGenId !== 'gen1' && glenoidParams.eccentricSphere) ? 'ECCENTRIC (+4mm)' : 'CONCENTRIC'}
                      </button>
                    </div>
                  </div>

                  {/* Key Design Parameters */}
                  <div className="grid grid-cols-2 gap-2">
                    <div className="p-2.5 rounded-xl bg-slate-900/70 border border-slate-800">
                      <div className="text-[10px] text-slate-400">COR Lateralization</div>
                      <div className="text-xs font-bold text-white mt-0.5">{activeRsaGen.corShift}</div>
                    </div>
                    <div className="p-2.5 rounded-xl bg-slate-900/70 border border-slate-800">
                      <div className="text-[10px] text-slate-400">Humeral NSA</div>
                      <div className="text-xs font-bold text-white mt-0.5">{activeRsaGen.nsa}</div>
                    </div>
                    <div className="p-2.5 rounded-xl bg-slate-900/70 border border-slate-800">
                      <div className="text-[10px] text-slate-400">Humeral Architecture</div>
                      <div className="text-xs font-bold text-sky-300 mt-0.5">{activeRsaGen.humeralDesign}</div>
                    </div>
                    <div className="p-2.5 rounded-xl bg-slate-900/70 border border-slate-800">
                      <div className="text-[10px] text-slate-400">Glenoid Wear Strategy</div>
                      <div className="text-xs font-bold text-amber-300 mt-0.5">{activeRsaGen.glenoidCorrection}</div>
                    </div>
                  </div>

                  {/* Concise Design Notes */}
                  <div className="space-y-1.5">
                    {activeRsaGen.notes.map((note, i) => (
                      <div key={i} className="p-2.5 rounded-xl bg-slate-900/50 border border-slate-800/80 text-[11px] text-slate-300 leading-relaxed">
                        • {note}
                      </div>
                    ))}
                  </div>
                </>
              ) : (
                <>
                  <div>
                    <h2 className="text-sm font-bold text-white">{activeAnchorGen.title}</h2>
                    <p className="text-[11px] text-sky-300 font-medium">{activeAnchorGen.subtitle}</p>
                  </div>

                  {/* Concise Implant Footprint Comparison Bar */}
                  <div className="p-3 rounded-xl bg-slate-900/85 border border-slate-800 space-y-2">
                    <div className="flex justify-between text-[11px] font-bold">
                      <span className="text-slate-200">Implant Footprint</span>
                      <span className="text-sky-300">{activeAnchorGen.footprint}</span>
                    </div>
                    <div className="h-2 rounded-full bg-slate-950 overflow-hidden border border-slate-800">
                      <div
                        className="h-full rounded-full bg-sky-400 transition-all duration-300"
                        style={{
                          width: anchorGenId === 'ti' ? '100%' : anchorGenId === 'peek' ? '82%' : anchorGenId === 'biocomp' ? '80%' : '29%'
                        }}
                      />
                    </div>
                  </div>

                  {/* Key Anchor Specs */}
                  <div className="grid grid-cols-2 gap-2">
                    <div className="p-2.5 rounded-xl bg-slate-900/70 border border-slate-800">
                      <div className="text-[10px] text-slate-400">Fixation Mechanism</div>
                      <div className="text-xs font-bold text-white mt-0.5">{activeAnchorGen.fixationMechanism}</div>
                    </div>
                    <div className="p-2.5 rounded-xl bg-slate-900/70 border border-slate-800">
                      <div className="text-[10px] text-slate-400">Post-Op MRI Profile</div>
                      <div className="text-xs font-bold text-sky-300 mt-0.5">{activeAnchorGen.mriProfile}</div>
                    </div>
                    <div className="col-span-2 p-2.5 rounded-xl bg-slate-900/70 border border-slate-800">
                      <div className="text-[10px] text-slate-400">Primary Clinical Role</div>
                      <div className="text-xs font-bold text-slate-200 mt-0.5">{activeAnchorGen.clinicalRole}</div>
                    </div>
                  </div>

                  {/* Concise Notes */}
                  <div className="space-y-1.5">
                    {activeAnchorGen.notes.map((note, i) => (
                      <div key={i} className="p-2.5 rounded-xl bg-slate-900/50 border border-slate-800/80 text-[11px] text-slate-300 leading-relaxed">
                        • {note}
                      </div>
                    ))}
                  </div>
                </>
              )}

            </div>
          </section>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
