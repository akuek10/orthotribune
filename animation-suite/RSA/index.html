    // --- Error Boundary for Crash-Proof Mobile WebGL ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || '3D Viewport initialization error' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="h-full w-full flex items-center justify-center bg-[#070B14] p-6 text-center">
              <div className="max-w-sm rounded-2xl border border-rose-500/30 bg-[#0F172A] p-6 shadow-2xl">
                <AlertTriangle className="w-10 h-10 text-rose-400 mx-auto mb-3" />
                <h2 className="text-base font-semibold text-white mb-1">3D Viewport Recovery</h2>
                <p className="text-xs text-slate-400 mb-4">{this.state.message}</p>
                <button
                  onClick={() => window.location.reload()}
                  className="px-4 py-2.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-medium transition"
                >
                  Reload Studio
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- High-Realism Sculpted 3D CT Anatomy & Implant Builders ---
    function createScapulaGroup(boneOpacity, deformity, correctionMode, augmentType, augmentOrient, notchRisk) {
      const group = new THREE.Group();

      const boneMat = new THREE.MeshPhysicalMaterial({
        color: 0xddd0bc,
        roughness: 0.56,
        metalness: 0.04,
        transparent: true,
        opacity: boneOpacity,
        depthWrite: boneOpacity > 0.85,
        side: THREE.DoubleSide
      });

      const subchondralMat = new THREE.MeshPhysicalMaterial({
        color: 0xcab99e,
        roughness: 0.45,
        metalness: 0.06,
        transparent: true,
        opacity: Math.min(0.95, boneOpacity + 0.14),
        depthWrite: boneOpacity > 0.8
      });

      const wireMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: Math.max(0.14, (1 - boneOpacity) * 0.5)
      });

      // 1. Sculpted Subscapular Blade
      const bladeShape = new THREE.Shape();
      bladeShape.moveTo(-0.08, 0.32);
      bladeShape.quadraticCurveTo(-1.15, 0.95, -2.35, 1.38);
      bladeShape.quadraticCurveTo(-2.52, -0.55, -2.58, -2.68);
      bladeShape.quadraticCurveTo(-1.35, -1.78, -0.36, -0.82);
      bladeShape.quadraticCurveTo(-0.18, -0.45, -0.08, 0.32);

      const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, {
        depth: 0.12,
        bevelEnabled: true,
        bevelThickness: 0.045,
        bevelSize: 0.055,
        bevelSegments: 3
      });
      const bladeMesh = new THREE.Mesh(bladeGeo, boneMat);
      bladeMesh.position.set(-0.22, 0, -0.06);
      group.add(bladeMesh);

      const bladeEdges = new THREE.LineSegments(new THREE.EdgesGeometry(bladeGeo, 24), wireMat);
      bladeEdges.position.set(-0.22, 0, -0.06);
      group.add(bladeEdges);

      // 2. Curved Lateral Axillary Pillar & Inferior Scapular Neck
      const pillarCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-1.35, -1.95, -0.02),
        new THREE.Vector3(-0.78, -1.25, 0.01),
        new THREE.Vector3(-0.36, -0.68, 0.02),
        new THREE.Vector3(-0.12, -0.42, 0.02)
      ]);
      const pillarGeo = new THREE.TubeGeometry(pillarCurve, 28, 0.165, 16, false);
      const pillarMesh = new THREE.Mesh(pillarGeo, boneMat);
      group.add(pillarMesh);

      // Sirveaux Scapular Notching Erosion Zone
      if (notchRisk === 'HIGH' || notchRisk === 'MODERATE') {
        const notchMat = new THREE.MeshStandardMaterial({
          color: notchRisk === 'HIGH' ? 0xf43f5e : 0xf59e0b,
          emissive: notchRisk === 'HIGH' ? 0x9f1239 : 0x78350f,
          emissiveIntensity: 0.65,
          transparent: true,
          opacity: notchRisk === 'HIGH' ? 0.72 : 0.45,
          roughness: 0.35
        });
        const notchZone = new THREE.Mesh(new THREE.SphereGeometry(0.145, 18, 16), notchMat);
        notchZone.scale.set(1.2, 1.45, 1.1);
        notchZone.position.set(-0.14, -0.46, 0.02);
        group.add(notchZone);
      }

      // 3. Organic Pear-Shaped Glenoid Vault
      const vaultPoints = [
        new THREE.Vector2(0.01, -0.68),
        new THREE.Vector2(0.24, -0.62),
        new THREE.Vector2(0.32, -0.38),
        new THREE.Vector2(0.39, -0.14),
        new THREE.Vector2(0.47, 0.02),
        new THREE.Vector2(0.45, 0.06),
        new THREE.Vector2(0.01, 0.06)
      ];
      const vaultGeo = new THREE.LatheGeometry(vaultPoints, 32);
      vaultGeo.rotateZ(-Math.PI / 2);
      vaultGeo.scale(1.0, 1.08, 0.88);
      const vaultMesh = new THREE.Mesh(vaultGeo, boneMat);
      vaultMesh.position.set(0.02, 0, 0);
      group.add(vaultMesh);

      const rimGeo = new THREE.TorusGeometry(0.44, 0.058, 16, 36);
      rimGeo.rotateY(Math.PI / 2);
      rimGeo.scale(1.0, 1.08, 0.88);
      const rimMesh = new THREE.Mesh(rimGeo, subchondralMat);
      rimMesh.position.set(0.06, 0, 0);
      group.add(rimMesh);

      // 4. Glenoid Deformity Wear Zone
      if (deformity !== 'neutral') {
        const isPosterior = deformity === 'walchB2';
        const defectGeo = new THREE.CylinderGeometry(0.43, 0.43, 0.19, 28, 1, false, 0, Math.PI);
        defectGeo.rotateZ(-Math.PI / 2);
        if (isPosterior) {
          defectGeo.rotateX(Math.PI);
        } else {
          defectGeo.rotateX(Math.PI / 2);
        }
        const isCorrectedByAugment = correctionMode === 'augment' && augmentType !== 'flat';
        const defectMat = new THREE.MeshStandardMaterial({
          color: correctionMode === 'reaming' ? 0xf43f5e : (isCorrectedByAugment ? 0x38bdf8 : 0xf59e0b),
          transparent: true,
          opacity: correctionMode === 'reaming' ? 0.58 : 0.36,
          roughness: 0.4
        });
        const defectMesh = new THREE.Mesh(defectGeo, defectMat);
        defectMesh.position.set(-0.02, 0, 0);
        group.add(defectMesh);
      }

      // 5. Sweeping Scapular Spine & Broad Overhanging Acromion Roof
      const spineCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.36, 0.92, -0.14),
        new THREE.Vector3(-1.45, 0.76, -0.32),
        new THREE.Vector3(-0.68, 0.74, -0.44),
        new THREE.Vector3(-0.24, 0.84, -0.42)
      ]);
      const spineGeo = new THREE.TubeGeometry(spineCurve, 24, 0.135, 14, false);
      group.add(new THREE.Mesh(spineGeo, boneMat));

      const acromionShape = new THREE.Shape();
      acromionShape.moveTo(-0.35, -0.22);
      acromionShape.quadraticCurveTo(0.18, -0.28, 0.48, -0.05);
      acromionShape.quadraticCurveTo(0.52, 0.22, 0.16, 0.28);
      acromionShape.quadraticCurveTo(-0.28, 0.24, -0.35, -0.22);
      const acromionGeo = new THREE.ExtrudeGeometry(acromionShape, {
        depth: 0.11,
        bevelEnabled: true,
        bevelThickness: 0.03,
        bevelSize: 0.03,
        bevelSegments: 2
      });
      acromionGeo.rotateX(Math.PI / 2);
      const acromionMesh = new THREE.Mesh(acromionGeo, boneMat);
      acromionMesh.position.set(0.08, 0.96, -0.16);
      acromionMesh.rotation.set(0.08, -0.16, -0.14);
      group.add(acromionMesh);

      // 6. Hooked Anterolateral Coracoid Process
      const coracoidCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.18, 0.44, 0.14),
        new THREE.Vector3(0.02, 0.65, 0.34),
        new THREE.Vector3(0.28, 0.58, 0.48),
        new THREE.Vector3(0.44, 0.44, 0.52)
      ]);
      const coracoidGeo = new THREE.TubeGeometry(coracoidCurve, 20, 0.105, 14, false);
      group.add(new THREE.Mesh(coracoidGeo, boneMat));

      return group;
    }

    function createGlenoidImplantGroup(cfg, corPos) {
      const group = new THREE.Group();

      const tiMat = new THREE.MeshStandardMaterial({
        color: 0x94a3b8,
        metalness: 0.78,
        roughness: 0.26
      });
      const porousGoldMat = new THREE.MeshStandardMaterial({
        color: 0xd97706,
        metalness: 0.65,
        roughness: 0.45
      });
      const cobaltChromeMat = new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        metalness: 0.9,
        roughness: 0.12
      });

      const reamRecess = (cfg.deformity !== 'neutral' && cfg.correctionMode === 'reaming') ? -0.11 : 0;
      const infShift = cfg.baseplatePos === 'inferior' ? -0.11 : 0;
      const bpRadius = cfg.baseplateDiam === 25 ? 0.36 : 0.42;
      const bpX = 0.08 + reamRecess;

      // Baseplate disc
      const bpGeo = new THREE.CylinderGeometry(bpRadius, bpRadius, 0.09, 32);
      bpGeo.rotateZ(-Math.PI / 2);
      const bpMesh = new THREE.Mesh(bpGeo, tiMat);
      bpMesh.position.set(bpX, infShift, 0);
      group.add(bpMesh);

      // Medially projecting angled wedge augment
      if (cfg.correctionMode === 'augment' && cfg.augmentType !== 'flat') {
        const isHalf = cfg.augmentType === 'half';
        const wedgeGeo = new THREE.CylinderGeometry(
          bpRadius * 0.98,
          bpRadius * 0.98,
          0.16,
          32,
          1,
          false,
          0,
          isHalf ? Math.PI : Math.PI * 2
        );
        wedgeGeo.rotateZ(-Math.PI / 2);
        if (cfg.augmentOrient === 'posterior') {
          wedgeGeo.rotateX(Math.PI);
        } else {
          wedgeGeo.rotateX(Math.PI / 2);
        }
        const wedgeMesh = new THREE.Mesh(wedgeGeo, porousGoldMat);
        wedgeMesh.position.set(bpX - 0.08, infShift, 0);
        group.add(wedgeMesh);
      }

      // Central fixation
      const postLen = cfg.centralFixation === 'shortPeg' ? 0.34 : cfg.centralFixation === 'longPost' ? 0.58 : 0.52;
      const postGeo = new THREE.CylinderGeometry(0.065, 0.055, postLen, 18);
      postGeo.rotateZ(-Math.PI / 2);
      const postMesh = new THREE.Mesh(postGeo, porousGoldMat);
      postMesh.position.set(bpX - postLen / 2, infShift, 0);
      group.add(postMesh);

      // Peripheral locking screws
      const screwCount = cfg.peripheralScrews;
      const splay = cfg.screwTrajectory === 'divergent' ? 0.24 : 0.04;
      const screwAngles = screwCount === 2 ? [0, Math.PI] : [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2];
      screwAngles.forEach((ang) => {
        const sGeo = new THREE.CylinderGeometry(0.032, 0.028, 0.48, 12);
        sGeo.rotateZ(-Math.PI / 2);
        const sMesh = new THREE.Mesh(sGeo, tiMat);
        const rOff = bpRadius * 0.65;
        const sy = infShift + Math.cos(ang) * rOff;
        const sz = Math.sin(ang) * rOff;
        sMesh.position.set(bpX - 0.24, sy, sz);
        sMesh.rotation.set(0, Math.sin(ang) * splay, -Math.cos(ang) * splay);
        group.add(sMesh);
      });

      // Lateralization metallic spacer
      const latOffset = cfg.glenoidLat * 0.026;
      if (latOffset > 0.005) {
        const latGeo = new THREE.CylinderGeometry(bpRadius * 0.92, bpRadius * 0.92, latOffset, 28);
        latGeo.rotateZ(-Math.PI / 2);
        const latMesh = new THREE.Mesh(latGeo, tiMat);
        latMesh.position.set(bpX + 0.045 + latOffset / 2, infShift, 0);
        group.add(latMesh);
      }

      // Glenosphere positioned around active COR
      const sphereRadius = (cfg.glenosphereDiam / 39) * 0.52;
      const sphereGeo = new THREE.SphereGeometry(sphereRadius, 36, 28, 0, Math.PI * 2, 0, Math.PI * 0.62);
      sphereGeo.rotateZ(-Math.PI / 2);
      const sphereMesh = new THREE.Mesh(sphereGeo, cobaltChromeMat);
      sphereMesh.position.set(corPos.x, corPos.y, corPos.z);
      group.add(sphereMesh);

      return group;
    }

    // --- Dedicated Intact Pre-Op CTA Humerus Builder (No Implants, No Osteotomy, Superior Head Migration) ---
    function createPreOpCTAHumerusGroup(boneOpacity, isGhostOverlay) {
      const root = new THREE.Group();

      const boneMat = isGhostOverlay
        ? new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            wireframe: true,
            transparent: true,
            opacity: 0.28
          })
        : new THREE.MeshPhysicalMaterial({
            color: 0xddd0bc,
            roughness: 0.58,
            metalness: 0.04,
            transparent: true,
            opacity: boneOpacity,
            depthWrite: boneOpacity > 0.85
          });

      const cartilageWearMat = isGhostOverlay
        ? new THREE.MeshBasicMaterial({
            color: 0xf59e0b,
            wireframe: true,
            transparent: true,
            opacity: 0.35
          })
        : new THREE.MeshStandardMaterial({
            color: 0xf59e0b,
            roughness: 0.4,
            transparent: true,
            opacity: Math.min(0.85, boneOpacity + 0.15)
          });

      // Intact spherical humeral head centered directly at nativeCOR (0,0,0 of pivot)
      const headGeo = new THREE.SphereGeometry(0.54, 28, 22);
      const headMesh = new THREE.Mesh(headGeo, boneMat);
      headMesh.position.set(0, 0, 0);
      root.add(headMesh);

      // Superior cuff-tear arthropathy (CTA) acetabularization wear patch on superior head
      const wearCapGeo = new THREE.SphereGeometry(0.548, 22, 14, 0, Math.PI * 2, 0, Math.PI * 0.28);
      const wearCap = new THREE.Mesh(wearCapGeo, cartilageWearMat);
      wearCap.position.set(0, 0, 0);
      root.add(wearCap);

      // Anatomical neck & shaft descending laterally from the intact head at native 135° inclination
      const shaftGroup = new THREE.Group();
      shaftGroup.position.set(0.36, -0.28, 0);
      root.add(shaftGroup);

      const humPoints = [
        new THREE.Vector2(0.01, -2.75),
        new THREE.Vector2(0.22, -2.72),
        new THREE.Vector2(0.24, -1.75),
        new THREE.Vector2(0.28, -1.15),
        new THREE.Vector2(0.32, -0.65),
        new THREE.Vector2(0.42, -0.10),
        new THREE.Vector2(0.38, 0.25),
        new THREE.Vector2(0.01, 0.25)
      ];
      const humBoneGeo = new THREE.LatheGeometry(humPoints, 32);
      const humBoneMesh = new THREE.Mesh(humBoneGeo, boneMat);
      shaftGroup.add(humBoneMesh);

      // Prominent Greater Tuberosity (collides with acromion around ~62° abduction in CTA)
      const gtGeo = new THREE.SphereGeometry(0.28, 20, 16);
      gtGeo.scale(1.1, 1.4, 0.95);
      const gtMesh = new THREE.Mesh(gtGeo, boneMat);
      gtMesh.position.set(0.24, 0.16, -0.08);
      shaftGroup.add(gtMesh);

      // Lesser Tuberosity
      const ltGeo = new THREE.SphereGeometry(0.20, 18, 14);
      ltGeo.scale(0.95, 1.2, 0.95);
      const ltMesh = new THREE.Mesh(ltGeo, boneMat);
      ltMesh.position.set(0.14, 0.12, 0.24);
      shaftGroup.add(ltMesh);

      return root;
    }

    // --- Post-Op RSA Humerus + Implant Builder ---
    function createPostOpRSAHumerusGroup(cfg, boneOpacity) {
      const root = new THREE.Group();

      const boneMat = new THREE.MeshPhysicalMaterial({
        color: 0xddd0bc,
        roughness: 0.58,
        metalness: 0.04,
        transparent: true,
        opacity: boneOpacity,
        depthWrite: boneOpacity > 0.85
      });

      const osteotomyMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.35,
        side: THREE.DoubleSide
      });

      const tiMat = new THREE.MeshStandardMaterial({
        color: 0x94a3b8,
        metalness: 0.8,
        roughness: 0.24
      });

      const darkCollarMat = new THREE.MeshStandardMaterial({
        color: 0x1e293b,
        metalness: 0.85,
        roughness: 0.28
      });

      const polyMat = new THREE.MeshPhysicalMaterial({
        color: 0xf8fafc,
        roughness: 0.2,
        metalness: 0.02,
        clearcoat: 0.45
      });

      const nsaRad = THREE.MathUtils.degToRad(cfg.nsa);
      const retroRad = THREE.MathUtils.degToRad(cfg.humeralVersion);
      const sphereRadius = (cfg.glenosphereDiam / 39) * 0.52;
      const polyThickOffset = cfg.polyThickness * 0.018;
      const trayOffset = cfg.humeralType === 'onlay' ? 0.145 : 0.028;
      const socketDist = sphereRadius + polyThickOffset + trayOffset;

      const cupPivot = new THREE.Group();
      cupPivot.rotation.set(retroRad, 0, -(Math.PI / 2 - (Math.PI - nsaRad)));
      root.add(cupPivot);

      // UHMWPE Liner
      const rimAngle = cfg.linerType === 'constrained' ? Math.PI * 0.44 : cfg.linerType === 'combo' ? Math.PI * 0.32 : Math.PI * 0.37;
      const linerGeo = new THREE.SphereGeometry(sphereRadius + 0.04, 32, 24, 0, Math.PI * 2, 0, rimAngle);
      linerGeo.rotateZ(Math.PI / 2);
      const linerMesh = new THREE.Mesh(linerGeo, polyMat);
      linerMesh.position.set(0.02, 0, 0);
      cupPivot.add(linerMesh);

      // Inlay SutureCup vs Proud Two-Tier Onlay Tray
      if (cfg.humeralType === 'inlay') {
        const cupGeo = new THREE.CylinderGeometry(0.41, 0.30, 0.24, 28);
        cupGeo.rotateZ(-Math.PI / 2);
        const cupMesh = new THREE.Mesh(cupGeo, tiMat);
        cupMesh.position.set(socketDist - 0.02, 0, 0);
        cupPivot.add(cupMesh);

        const collarGeo = new THREE.TorusGeometry(0.41, 0.022, 10, 28);
        collarGeo.rotateY(Math.PI / 2);
        const collarMesh = new THREE.Mesh(collarGeo, darkCollarMat);
        collarMesh.position.set(socketDist - 0.11, 0, 0);
        cupPivot.add(collarMesh);
      } else {
        const lowerCollarGeo = new THREE.CylinderGeometry(0.42, 0.39, 0.075, 28);
        lowerCollarGeo.rotateZ(-Math.PI / 2);
        const lowerCollar = new THREE.Mesh(lowerCollarGeo, darkCollarMat);
        lowerCollar.position.set(socketDist - 0.025, 0, 0);
        cupPivot.add(lowerCollar);

        const upperTrayGeo = new THREE.CylinderGeometry(0.46, 0.43, 0.085, 28);
        upperTrayGeo.rotateZ(-Math.PI / 2);
        const upperTray = new THREE.Mesh(upperTrayGeo, tiMat);
        upperTray.position.set(socketDist - 0.105, 0, 0);
        cupPivot.add(upperTray);
      }

      // Dynamic Surgical Neck Osteotomy Cut Plane Ring
      const cutPlaneX = cfg.humeralType === 'onlay' ? socketDist + 0.015 : socketDist - 0.11;
      const osteoRing = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.47, 32), osteotomyMat);
      osteoRing.rotation.set(0, Math.PI / 2, 0);
      osteoRing.position.set(cutPlaneX, 0, 0);
      cupPivot.add(osteoRing);

      // Humeral Shaft & Metaphysis descending along anatomical shaft axis
      const shaftGroup = new THREE.Group();
      shaftGroup.position.set(socketDist + 0.05, 0, 0);
      shaftGroup.rotation.set(0, 0, Math.PI - nsaRad);
      cupPivot.add(shaftGroup);

      const stemLen = cfg.stemType === 'short' ? 1.15 : 2.15;
      const stemGeo = new THREE.CylinderGeometry(0.16, 0.085, stemLen, 20);
      const stemMesh = new THREE.Mesh(stemGeo, tiMat);
      stemMesh.position.set(0.18, -stemLen / 2 - 0.05, 0);
      shaftGroup.add(stemMesh);

      if (cfg.stemType === 'fracture') {
        const finGeo = new THREE.BoxGeometry(0.40, 0.44, 0.045);
        const finMesh = new THREE.Mesh(finGeo, tiMat);
        finMesh.position.set(0.18, -0.28, 0);
        shaftGroup.add(finMesh);
      }

      const humPoints = [
        new THREE.Vector2(0.01, -2.85),
        new THREE.Vector2(0.22, -2.82),
        new THREE.Vector2(0.24, -1.85),
        new THREE.Vector2(0.28, -1.25),
        new THREE.Vector2(0.31, -0.75),
        new THREE.Vector2(0.39, -0.22),
        new THREE.Vector2(0.41, 0.02),
        new THREE.Vector2(0.01, 0.02)
      ];
      const humBoneGeo = new THREE.LatheGeometry(humPoints, 32);
      const humBoneMesh = new THREE.Mesh(humBoneGeo, boneMat);
      humBoneMesh.position.set(0.22, -0.02, 0);
      shaftGroup.add(humBoneMesh);

      const gtGeo = new THREE.SphereGeometry(0.26, 20, 16);
      gtGeo.scale(1.05, 1.35, 0.92);
      const gtMesh = new THREE.Mesh(gtGeo, boneMat);
      gtMesh.position.set(0.42, -0.24, -0.10);
      shaftGroup.add(gtMesh);

      const ltGeo = new THREE.SphereGeometry(0.19, 18, 14);
      ltGeo.scale(0.95, 1.2, 0.95);
      const ltMesh = new THREE.Mesh(ltGeo, boneMat);
      ltMesh.position.set(0.35, -0.26, 0.22);
      shaftGroup.add(ltMesh);

      return root;
    }

    function App() {
      // OrthoTribune Navigation Drawer State
      const [navOpen, setNavOpen] = useState(false);
      const [previewModule, setPreviewModule] = useState(null);

      // Active Tab & Viewport Controls
      const [activeTab, setActiveTab] = useState('humeral');
      const [cameraPreset, setCameraPreset] = useState('ap');
      const [boneOpacity, setBoneOpacity] = useState(0.55);
      const [showCOR, setShowCOR] = useState(true);
      const [showCTSlice, setShowCTSlice] = useState(false);
      const [constructView, setConstructView] = useState('postop'); // 'preop' | 'postop' | 'ghost'

      // Motion Simulation Controls
      const [motionMode, setMotionMode] = useState('abduction'); // 'adduction' | 'abduction' | 'er0' | 'er90' | 'ir'
      const [isPlaying, setIsPlaying] = useState(true);
      const [motionAngle, setMotionAngle] = useState(45);

      // Top 10 RSA Construct Parameters
      const [cfg, setCfg] = useState({
        // Humeral
        humeralType: 'onlay',       // 'inlay' | 'onlay'
        stemType: 'short',          // 'short' | 'standard' | 'fracture'
        nsa: 135,                   // 135 | 145 | 155
        humeralVersion: 20,         // 0 | 10 | 20 | 30
        polyThickness: 0,           // 0 | 3 | 6
        linerType: 'standard',      // 'standard' | 'constrained' | 'combo'
        // Glenoid
        deformity: 'walchB2',       // 'neutral' | 'walchB2' | 'favardE3'
        correctionMode: 'augment',  // 'reaming' | 'augment'
        augmentType: 'half',        // 'flat' | 'half' | 'full'
        augmentOrient: 'posterior', // 'posterior' | 'superior'
        baseplatePos: 'inferior',   // 'center' | 'inferior'
        glenoidLat: 3,              // 0 | 3 | 6 | 9
        glenosphereDiam: 39,        // 36 | 39 | 42
        infOverhang: 2,             // 0 | 2 | 4
        // Fixation
        baseplateDiam: 29,          // 25 | 29
        centralFixation: 'longPost',// 'shortPeg' | 'longPost' | 'compScrew'
        peripheralScrews: 4,        // 2 | 4
        screwTrajectory: 'divergent', // 'parallel' | 'divergent'
        boneQuality: 'normal'       // 'normal' | 'osteopenic'
      });

      const updateCfg = (key, val) => setCfg((prev) => ({ ...prev, [key]: val }));

      // --- Biomechanical & COR Calculations ---
      const biomech = useMemo(() => {
        // Native CTA superiorly migrated humeral head COR
        const nativeCOR = { x: 0.62, y: 0.24, z: 0.0 };

        const reamRecess = (cfg.deformity !== 'neutral' && cfg.correctionMode === 'reaming') ? -2.8 : 0;
        const latOffsetMm = cfg.glenoidLat + reamRecess;
        const infShiftMm = (cfg.baseplatePos === 'inferior' ? -2.8 : 0) - cfg.infOverhang;

        const activeCOR = {
          x: 0.14 + (latOffsetMm * 0.026),
          y: infShiftMm * 0.026,
          z: 0.0
        };

        const corLateralShiftMm = Math.round(((activeCOR.x - nativeCOR.x) / 0.026) * 10) / 10;
        const corInferiorShiftMm = Math.round(((activeCOR.y - nativeCOR.y) / 0.026) * 10) / 10;

        const humeralLatMm = (cfg.humeralType === 'onlay' ? 5.5 : 1.0) + cfg.polyThickness + (cfg.nsa === 135 ? 3.5 : cfg.nsa === 145 ? 1.5 : 0);
        const totalLatMm = Math.round((latOffsetMm + humeralLatMm) * 10) / 10;
        const distalizationMm = Math.round((Math.abs(infShiftMm) + (cfg.humeralType === 'onlay' ? 4.5 : 1.0) + (cfg.nsa === 155 ? 4.0 : cfg.nsa === 145 ? 2.0 : 0)) * 10) / 10;

        let philosophy = 'Classic Medialized (Grammont)';
        if (totalLatMm >= 14) {
          philosophy = 'Lateralized Construct (BIO / Metallic)';
        } else if (totalLatMm >= 8.5) {
          philosophy = 'Balanced Lateralized RSA';
        }

        const nsaNotchBonus = cfg.nsa === 135 ? 16 : cfg.nsa === 145 ? 8 : -10;
        const overhangBonus = cfg.infOverhang * 3.5 + (cfg.baseplatePos === 'inferior' ? 6 : 0);
        const latBonus = Math.max(0, latOffsetMm) * 1.4;
        const diamBonus = (cfg.glenosphereDiam - 36) * 1.8;
        const constrainedPenalty = cfg.linerType === 'constrained' ? -15 : cfg.linerType === 'combo' ? 4 : 0;

        const maxAdduction = Math.max(0, Math.min(35, Math.round(10 + nsaNotchBonus + overhangBonus + latBonus * 0.6 + constrainedPenalty)));
        const maxAbduction = Math.max(75, Math.min(155, Math.round(118 + (cfg.nsa === 135 ? 10 : 4) + latBonus + diamBonus + constrainedPenalty)));
        const maxER0 = Math.max(15, Math.min(75, Math.round(32 + (cfg.humeralVersion - 15) * 0.75 + latBonus * 1.1 + constrainedPenalty * 0.7)));
        const maxER90 = Math.max(30, Math.min(95, Math.round(58 + (cfg.humeralVersion - 15) * 0.8 + latBonus + constrainedPenalty * 0.7)));
        const maxIR = Math.max(20, Math.min(85, Math.round(56 - (cfg.humeralVersion - 15) * 0.85 + latBonus * 0.8 + constrainedPenalty * 0.7)));

        // Pre-op CTA Impingement-Free ROM Limits
        const preOpLimits = {
          adduction: 18,
          abduction: 62,
          er0: 16,
          er90: 28,
          ir: 34
        };

        const notchScore = (cfg.nsa === 155 ? 45 : cfg.nsa === 145 ? 20 : 5) - (cfg.infOverhang * 6) - (cfg.baseplatePos === 'inferior' ? 12 : 0) - Math.max(0, latOffsetMm) * 2.2;
        const notchRisk = notchScore >= 25 ? 'HIGH' : notchScore >= 8 ? 'MODERATE' : 'LOW';

        const sphereR = cfg.glenosphereDiam / 2;
        const socketDepthRatio = cfg.linerType === 'constrained' ? 0.44 : cfg.linerType === 'combo' ? 0.26 : 0.33;
        const jumpHeightMm = Math.round((sphereR * socketDepthRatio + cfg.polyThickness * 0.25) * 10) / 10;

        const deltoidTensionPct = Math.round(100 + distalizationMm * 1.6 + Math.max(0, latOffsetMm) * 1.8 + cfg.polyThickness * 1.5);
        const acromialStress = deltoidTensionPct > 142 ? 'ELEVATED' : deltoidTensionPct > 125 ? 'MODERATE' : 'OPTIMAL';

        const bonePreservedPct = cfg.deformity === 'neutral'
          ? 96
          : cfg.correctionMode === 'reaming'
            ? 64
            : cfg.augmentType === 'flat'
              ? 78
              : 93;

        let fixPoints = 0;
        if (cfg.baseplateDiam === 29) fixPoints += 2; else fixPoints += 1;
        if (cfg.centralFixation === 'longPost') fixPoints += 3; else if (cfg.centralFixation === 'compScrew') fixPoints += 2; else fixPoints += 1;
        if (cfg.peripheralScrews === 4) fixPoints += 2; else fixPoints += 1;
        if (cfg.screwTrajectory === 'divergent') fixPoints += 2; else fixPoints += 1;
        if (cfg.boneQuality === 'normal') fixPoints += 2; else fixPoints -= 1;
        if (cfg.glenoidLat >= 9) fixPoints -= 1;

        const fixationConfidence = fixPoints >= 9 ? 'HIGH' : fixPoints >= 6 ? 'MODERATE' : 'LOW';

        return {
          nativeCOR,
          activeCOR,
          corLateralShiftMm,
          corInferiorShiftMm,
          totalLatMm,
          distalizationMm,
          philosophy,
          maxAdduction,
          maxAbduction,
          maxER0,
          maxER90,
          maxIR,
          preOpLimits,
          notchRisk,
          jumpHeightMm,
          deltoidTensionPct,
          acromialStress,
          bonePreservedPct,
          fixationConfidence
        };
      }, [cfg]);

      // --- Three.js Scene Setup ---
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const rsaPivotRef = useRef(null);
      const preOpPivotRef = useRef(null);
      const stateRef = useRef({ motionMode, isPlaying, motionAngle, biomech, constructView });

      useEffect(() => {
        stateRef.current = { motionMode, isPlaying, motionAngle, biomech, constructView };
      }, [motionMode, isPlaying, motionAngle, biomech, constructView]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        } catch (err) {
          return;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);
        rendererRef.current = renderer;

        const scene = new THREE.Scene();
        sceneRef.current = scene;

        const camera = new THREE.PerspectiveCamera(36, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0.3, 0.2, 5.4);
        cameraRef.current = camera;

        scene.add(new THREE.AmbientLight(0xdbeafe, 0.95));
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.35);
        keyLight.position.set(4, 6, 6);
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.75);
        rimLight.position.set(-5, -2, -4);
        scene.add(rimLight);

        const grid = new THREE.GridHelper(8, 16, 0x1e293b, 0x0f172a);
        grid.rotation.set(Math.PI / 2, 0, 0);
        grid.position.set(0, 0, -2.2);
        scene.add(grid);

        let isDragging = false;
        let prevX = 0;
        let prevY = 0;
        let spherical = { theta: 0.12, phi: Math.PI / 2 - 0.06, radius: 5.3 };

        const updateCamFromSpherical = () => {
          spherical.phi = Math.max(0.2, Math.min(Math.PI - 0.2, spherical.phi));
          spherical.radius = Math.max(2.1, Math.min(9.0, spherical.radius));
          const x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
          const y = spherical.radius * Math.cos(spherical.phi);
          const z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
          camera.position.set(x, y, z);
          camera.lookAt(0.15, -0.15, 0);
        };
        updateCamFromSpherical();

        camera.userData.setSpherical = (theta, phi, radius) => {
          spherical = { theta, phi, radius };
          updateCamFromSpherical();
        };

        const onPointerDown = (e) => {
          isDragging = true;
          prevX = e.clientX;
          prevY = e.clientY;
        };
        const onPointerMove = (e) => {
          if (!isDragging) return;
          const dx = e.clientX - prevX;
          const dy = e.clientY - prevY;
          prevX = e.clientX;
          prevY = e.clientY;
          spherical.theta -= dx * 0.008;
          spherical.phi -= dy * 0.008;
          updateCamFromSpherical();
        };
        const onPointerUp = () => { isDragging = false; };
        const onWheel = (e) => {
          e.preventDefault();
          spherical.radius += e.deltaY * 0.003;
          updateCamFromSpherical();
        };

        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        dom.addEventListener('wheel', onWheel, { passive: false });

        const onResize = () => {
          if (!container || !renderer || !camera) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', onResize);

        const applyPivotRotation = (pivot, mode, deg) => {
          if (!pivot) return;
          const rad = THREE.MathUtils.degToRad(deg);
          if (mode === 'adduction') {
            pivot.rotation.set(0, 0, -rad);
          } else if (mode === 'abduction') {
            pivot.rotation.set(0, 0, rad);
          } else if (mode === 'er0') {
            pivot.rotation.set(-rad, 0, 0);
          } else if (mode === 'er90') {
            pivot.rotation.set(-rad, 0, Math.PI / 2);
          } else if (mode === 'ir') {
            pivot.rotation.set(rad, 0, 0);
          }
        };

        let animId;
        let phase = 0;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          const st = stateRef.current;

          const activeMax =
            st.constructView === 'preop'
              ? st.biomech.preOpLimits[st.motionMode]
              : st.motionMode === 'adduction' ? st.biomech.maxAdduction :
                st.motionMode === 'abduction' ? st.biomech.maxAbduction :
                st.motionMode === 'er0' ? st.biomech.maxER0 :
                st.motionMode === 'er90' ? st.biomech.maxER90 : st.biomech.maxIR;

          let currentDeg = st.motionAngle;
          if (st.isPlaying) {
            phase += 0.022;
            const wave = (Math.sin(phase) + 1) / 2;
            const startDeg = st.motionMode === 'abduction' ? 12 : 0;
            currentDeg = Math.round(startDeg + wave * (activeMax + 6 - startDeg));
            setMotionAngle(currentDeg);
          }

          // Rotate Post-Op RSA pivot around activeCOR
          applyPivotRotation(rsaPivotRef.current, st.motionMode, currentDeg);

          // Rotate Pre-Op CTA pivot around nativeCOR (capped at Pre-Op CTA subacromial/capsular block in Ghost mode)
          const preOpLimit = st.biomech.preOpLimits[st.motionMode];
          const preOpDeg = st.constructView === 'ghost' ? Math.min(currentDeg, preOpLimit) : currentDeg;
          applyPivotRotation(preOpPivotRef.current, st.motionMode, preOpDeg);

          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          dom.removeEventListener('pointerdown', onPointerDown);
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
          dom.removeEventListener('wheel', onWheel);
          window.removeEventListener('resize', onResize);
          renderer.dispose();
          if (container.contains(dom)) container.removeChild(dom);
        };
      }, []);

      // Rebuild 3D Anatomy & Implants when config or constructView changes
      useEffect(() => {
        const scene = sceneRef.current;
        if (!scene) return;

        const toRemove = [];
        scene.children.forEach((child) => {
          if (child.userData.isDynamicConstruct) toRemove.push(child);
        });
        toRemove.forEach((obj) => scene.remove(obj));

        rsaPivotRef.current = null;
        preOpPivotRef.current = null;

        const root = new THREE.Group();
        root.userData.isDynamicConstruct = true;

        // 1. High-Realism Sculpted Scapula CT Mesh (no deformity wear highlight in pure Pre-Op CTA if preferred, or show native pathology)
        const scapula = createScapulaGroup(
          boneOpacity,
          cfg.deformity,
          constructView === 'preop' ? 'none' : cfg.correctionMode,
          cfg.augmentType,
          cfg.augmentOrient,
          constructView === 'preop' ? 'LOW' : biomech.notchRisk
        );
        root.add(scapula);

        // 2. Post-Op RSA Glenoid & Humeral Construct (shown in 'postop' and 'ghost' modes)
        if (constructView === 'postop' || constructView === 'ghost') {
          const glenoidImplant = createGlenoidImplantGroup(cfg, biomech.activeCOR);
          root.add(glenoidImplant);

          const rsaPivot = new THREE.Group();
          rsaPivot.position.set(biomech.activeCOR.x, biomech.activeCOR.y, biomech.activeCOR.z);
          const postOpHum = createPostOpRSAHumerusGroup(cfg, boneOpacity);
          rsaPivot.add(postOpHum);
          root.add(rsaPivot);
          rsaPivotRef.current = rsaPivot;
        }

        // 3. Dedicated Intact Pre-Op CTA Humerus (solid in 'preop', translucent cyan wireframe in 'ghost')
        if (constructView === 'preop' || constructView === 'ghost') {
          const prePivot = new THREE.Group();
          prePivot.position.set(biomech.nativeCOR.x, biomech.nativeCOR.y, biomech.nativeCOR.z);
          const preOpHum = createPreOpCTAHumerusGroup(boneOpacity, constructView === 'ghost');
          prePivot.add(preOpHum);
          root.add(prePivot);
          preOpPivotRef.current = prePivot;
        }

        // 4. Center of Rotation (COR) Visualizers
        if (showCOR) {
          const natSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.085, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true })
          );
          natSphere.position.set(biomech.nativeCOR.x, biomech.nativeCOR.y, biomech.nativeCOR.z);
          root.add(natSphere);

          if (constructView !== 'preop') {
            const actSphere = new THREE.Mesh(
              new THREE.SphereGeometry(0.075, 16, 16),
              new THREE.MeshBasicMaterial({ color: 0xf59e0b })
            );
            actSphere.position.set(biomech.activeCOR.x, biomech.activeCOR.y, biomech.activeCOR.z);
            root.add(actSphere);

            const lineGeo = new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(biomech.nativeCOR.x, biomech.nativeCOR.y, biomech.nativeCOR.z),
              new THREE.Vector3(biomech.activeCOR.x, biomech.activeCOR.y, biomech.activeCOR.z)
            ]);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xf59e0b });
            root.add(new THREE.Line(lineGeo, lineMat));
          }
        }

        // 5. Axial CT Reference Slice Plane
        if (showCTSlice) {
          const slicePlane = new THREE.Mesh(
            new THREE.PlaneGeometry(3.4, 2.4),
            new THREE.MeshBasicMaterial({
              color: 0x38bdf8,
              transparent: true,
              opacity: 0.12,
              side: THREE.DoubleSide
            })
          );
          slicePlane.rotation.set(Math.PI / 2, 0, 0);
          slicePlane.position.set(0.1, 0.0, 0.0);
          root.add(slicePlane);

          const sliceBorder = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.PlaneGeometry(3.4, 2.4)),
            new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45 })
          );
          sliceBorder.rotation.set(Math.PI / 2, 0, 0);
          sliceBorder.position.set(0.1, 0.0, 0.0);
          root.add(sliceBorder);
        }

        scene.add(root);
      }, [cfg, boneOpacity, showCOR, showCTSlice, constructView, biomech]);

      // Apply Camera Preset
      const handleCameraPreset = (preset) => {
        setCameraPreset(preset);
        const cam = cameraRef.current;
        if (!cam || !cam.userData.setSpherical) return;
        if (preset === 'ap') cam.userData.setSpherical(0.12, Math.PI / 2 - 0.06, 5.3);
        else if (preset === 'axillary') cam.userData.setSpherical(0.1, 0.26, 5.1);
        else if (preset === 'scapularY') cam.userData.setSpherical(Math.PI / 2 - 0.15, Math.PI / 2, 5.3);
        else if (preset === 'enface') cam.userData.setSpherical(Math.PI / 2, Math.PI / 2 - 0.05, 4.4);
        else if (preset === 'inlayOnlay') cam.userData.setSpherical(0.28, Math.PI / 2 - 0.12, 2.85);
        else if (preset === 'notch') cam.userData.setSpherical(0.18, Math.PI / 2 + 0.14, 3.6);
      };

      const postOpLimit =
        motionMode === 'adduction' ? biomech.maxAdduction :
        motionMode === 'abduction' ? biomech.maxAbduction :
        motionMode === 'er0' ? biomech.maxER0 :
        motionMode === 'er90' ? biomech.maxER90 : biomech.maxIR;
      const preOpLimit = biomech.preOpLimits[motionMode];
      const currentLimit = constructView === 'preop' ? preOpLimit : postOpLimit;
      const isImpinging = motionAngle > currentLimit;

      return (
        <div className="h-full w-full flex flex-col lg:flex-row bg-[#070B14] text-slate-100 select-none overflow-hidden">

          {/* --- OrthoTribune Slide-Over Navigation Drawer (nav.js architecture) --- */}
          {navOpen && (
            <div className="fixed inset-0 z-50 flex">
              <div
                className="fixed inset-0 bg-black/70 backdrop-blur-xs"
                onClick={() => setNavOpen(false)}
              />
              <aside className="relative z-10 w-80 max-w-[86vw] h-full bg-[#0B1120] border-r border-slate-800 flex flex-col overflow-y-auto shadow-2xl">
                <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                  <div>
                    <div className="text-sm font-bold tracking-wider text-white">
                      ORTHO<span className="text-sky-400">TRIBUNE</span>
                    </div>
                    <div className="text-[11px] text-slate-400">Clinical Evidence & VAC Intelligence</div>
                  </div>
                  <button
                    onClick={() => setNavOpen(false)}
                    className="p-2 rounded-lg bg-slate-800/80 text-slate-300 hover:text-white"
                    aria-label="Close Menu"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <div className="p-3 border-b border-slate-800/80">
                  <a
                    href="/"
                    className="flex items-center justify-between w-full px-3.5 py-2.5 rounded-xl bg-sky-500/15 border border-sky-500/30 text-sky-300 hover:bg-sky-500/25 text-xs font-semibold transition"
                  >
                    <span>← Back to OrthoTribune.com</span>
                    <ExternalLink className="w-3.5 h-3.5" />
                  </a>
                </div>

                <div className="p-3 border-b border-slate-800/80">
                  <div className="px-2 pb-2 text-[10px] font-bold uppercase tracking-widest text-sky-400">
                    Animation Suite Studios
                  </div>
                  <div className="space-y-1.5">
                    {ANIMATION_SUITE_MODULES.map((mod) => {
                      const isActive = mod.id === 'rsa';
                      return (
                        <button
                          key={mod.id}
                          onClick={() => {
                            if (isActive) {
                              setPreviewModule(null);
                              setNavOpen(false);
                            } else {
                              setPreviewModule(mod);
                              setNavOpen(false);
                            }
                          }}
                          className={`w-full text-left p-2.5 rounded-xl border transition ${
                            isActive
                              ? 'bg-sky-500/15 border-sky-500/40 text-white'
                              : 'bg-slate-900/60 border-slate-800/80 text-slate-300 hover:border-slate-700'

                          key={c.id}
                          onClick={() => {
                            if (constructView === 'preop') setConstructView('postop');
                            updateCfg('correctionMode', c.id);
                          }}
                          className={`p-2.5 rounded-xl border text-left min-h-[54px] ${
                            cfg.correctionMode === c.id
                              ? 'bg-sky-500/15 border-sky-400 text-white'
                              : 'bg-slate-900/70 border-slate-800 text-slate-300'
                          }`}
                        >
                          <div className="text-xs font-bold">{c.title}</div>
                          <div className="text-[10px] text-slate-400">{c.desc}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  {cfg.correctionMode === 'augment' && (
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Wedge Geometry</div>
                        <div className="grid grid-cols-3 gap-1.5">
                          {[
                            { id: 'flat', label: 'Flat' },
                            { id: 'half', label: 'Half 15°' },
                            { id: 'full', label: 'Full 15°' }
                          ].map((w) => (
                            <button
                              key={w.id}
                              onClick={() => {
                                if (constructView === 'preop') setConstructView('postop');
                                updateCfg('augmentType', w.id);
                              }}
                              className={`py-2 rounded-xl border text-[11px] font-semibold min-h-[44px] ${
                                cfg.augmentType === w.id
                                  ? 'bg-amber-500/20 border-amber-400 text-amber-200'
                                  : 'bg-slate-900/70 border-slate-800 text-slate-400'
                              }`}
                            >
                              {w.label}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Augment Orientation</div>
                        <div className="grid grid-cols-2 gap-1.5">
                          {[
                            { id: 'posterior', label: 'Posterior' },
                            { id: 'superior', label: 'Superior' }
                          ].map((o) => (
                            <button
                              key={o.id}
                              onClick={() => {
                                if (constructView === 'preop') setConstructView('postop');
                                updateCfg('augmentOrient', o.id);
                              }}
                              className={`py-2 rounded-xl border text-[11px] font-semibold min-h-[44px] ${
                                cfg.augmentOrient === o.id
                                  ? 'bg-amber-500/20 border-amber-400 text-amber-200'
                                  : 'bg-slate-900/70 border-slate-800 text-slate-400'
                              }`}
                            >
                              {o.label}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Glenosphere Diameter</div>
                      <div className="grid grid-cols-3 gap-1.5">
                        {[36, 39, 42].map((d) => (
                          <button
                            key={d}
                            onClick={() => {
                              if (constructView === 'preop') setConstructView('postop');
                              updateCfg('glenosphereDiam', d);
                            }}
                            className={`py-2 rounded-xl border text-[11px] font-bold min-h-[44px] ${
                              cfg.glenosphereDiam === d
                                ? 'bg-sky-500/15 border-sky-400 text-white'
                                : 'bg-slate-900/70 border-slate-800 text-slate-400'
                            }`}
                          >
                            {d}mm
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Inferior Overhang</div>
                      <div className="grid grid-cols-3 gap-1.5">
                        {[0, 2, 4].map((ov) => (
                          <button
                            key={ov}
                            onClick={() => {
                              if (constructView === 'preop') setConstructView('postop');
                              updateCfg('infOverhang', ov);
                            }}
                            className={`py-2 rounded-xl border text-[11px] font-bold min-h-[44px] ${
                              cfg.infOverhang === ov
                                ? 'bg-sky-500/15 border-sky-400 text-white'
                                : 'bg-slate-900/70 border-slate-800 text-slate-400'
                            }`}
                          >
                            +{ov}mm
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Glenoid Lateralization</div>
                      <div className="grid grid-cols-4 gap-1">
                        {[0, 3, 6, 9].map((lat) => (
                          <button
                            key={lat}
                            onClick={() => {
                              if (constructView === 'preop') setConstructView('postop');
                              updateCfg('glenoidLat', lat);
                            }}
                            className={`py-2 rounded-xl border text-[11px] font-bold min-h-[44px] ${
                              cfg.glenoidLat === lat
                                ? 'bg-sky-500/15 border-sky-400 text-white'
                                : 'bg-slate-900/70 border-slate-800 text-slate-400'
                            }`}
                          >
                            +{lat}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Baseplate Position</div>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[
                          { id: 'center', label: 'Center' },
                          { id: 'inferior', label: 'Inf. Flush' }
                        ].map((p) => (
                          <button
                            key={p.id}
                            onClick={() => {
                              if (constructView === 'preop') setConstructView('postop');
                              updateCfg('baseplatePos', p.id);
                            }}
                            className={`py-2 rounded-xl border text-[11px] font-semibold min-h-[44px] ${
                              cfg.baseplatePos === p.id
                                ? 'bg-sky-500/15 border-sky-400 text-white'
                                : 'bg-slate-900/70 border-slate-800 text-slate-400'
                            }`}
                          >
                            {p.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                </>
              )}

              {/* TAB 3: FIXATION */}
              {activeTab === 'fixation' && (
                <>
                  <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800 flex items-center justify-between">
                    <div>
                      <div className="text-[10px] uppercase text-slate-400">Conceptual Fixation Confidence</div>
                      <div className="text-xs text-slate-300">Heuristic primary stability & shear balance</div>
                    </div>
                    <span
                      className={`px-3 py-1 rounded-lg text-xs font-bold border ${
                        biomech.fixationConfidence === 'HIGH'
                          ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
                          : biomech.fixationConfidence === 'MODERATE'
                            ? 'bg-amber-500/15 border-amber-500/40 text-amber-300'
                            : 'bg-rose-500/15 border-rose-500/40 text-rose-300'
                      }`}
                    >
                      {biomech.fixationConfidence}
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Baseplate Diameter</div>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[25, 29].map((d) => (
                          <button
                            key={d}
                            onClick={() => updateCfg('baseplateDiam', d)}
                            className={`py-2 rounded-xl border text-xs font-bold min-h-[44px] ${
                              cfg.baseplateDiam === d
                                ? 'bg-sky-500/15 border-sky-400 text-white'
                                : 'bg-slate-900/70 border-slate-800 text-slate-400'
                            }`}
                          >
                            {d} mm
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Peripheral Screws</div>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[2, 4].map((cnt) => (
                          <button
                            key={cnt}
                            onClick={() => updateCfg('peripheralScrews', cnt)}
                            className={`py-2 rounded-xl border text-xs font-bold min-h-[44px] ${
                              cfg.peripheralScrews === cnt
                                ? 'bg-sky-500/15 border-sky-400 text-white'
                                : 'bg-slate-900/70 border-slate-800 text-slate-400'
                            }`}
                          >
                            {cnt} Screws
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div>
                    <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Central Fixation Architecture</div>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'shortPeg', label: 'Short Peg', sub: 'Bone-sparing' },
                        { id: 'longPost', label: 'Long Post', sub: 'Vault purchase' },
                        { id: 'compScrew', label: 'Comp. Screw', sub: '6.5mm lag' }
                      ].map((f) => (
                        <button
                          key={f.id}
                          onClick={() => updateCfg('centralFixation', f.id)}
                          className={`p-2 rounded-xl border text-center min-h-[48px] ${
                            cfg.centralFixation === f.id
                              ? 'bg-sky-500/15 border-sky-400 text-white'
                              : 'bg-slate-900/70 border-slate-800 text-slate-300'
                          }`}
                        >
                          <div className="text-xs font-bold">{f.label}</div>
                          <div className="text-[10px] text-slate-400">{f.sub}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Screw Trajectory</div>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[
                          { id: 'parallel', label: 'Parallel' },
                          { id: 'divergent', label: 'Divergent' }
                        ].map((tr) => (
                          <button
                            key={tr.id}
                            onClick={() => updateCfg('screwTrajectory', tr.id)}
                            className={`py-2 rounded-xl border text-[11px] font-semibold min-h-[44px] ${
                              cfg.screwTrajectory === tr.id
                                ? 'bg-sky-500/15 border-sky-400 text-white'
                                : 'bg-slate-900/70 border-slate-800 text-slate-400'
                            }`}
                          >
                            {tr.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Bone Quality Assumption</div>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[
                          { id: 'normal', label: 'Normal' },
                          { id: 'osteopenic', label: 'Osteopenic' }
                        ].map((bq) => (
                          <button
                            key={bq.id}
                            onClick={() => updateCfg('boneQuality', bq.id)}
                            className={`py-2 rounded-xl border text-[11px] font-semibold min-h-[44px] ${
                              cfg.boneQuality === bq.id
                                ? 'bg-sky-500/15 border-sky-400 text-white'
                                : 'bg-slate-900/70 border-slate-800 text-slate-400'
                            }`}
                          >
                            {bq.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                </>
              )}

              {/* TAB 4: ROM & TRADE-OFFS */}
              {activeTab === 'rom' && (
                <>
                  <div>
                    <div className="text-[11px] font-semibold text-slate-300 mb-1.5">Kinematic Simulation Plane</div>
                    <div className="grid grid-cols-5 gap-1.5">
                      {[
                        { id: 'adduction', label: 'Add/Notch' },
                        { id: 'abduction', label: 'Abduction' },
                        { id: 'er0', label: 'ER 0°' },
                        { id: 'er90', label: 'ER 90°' },
                        { id: 'ir', label: 'IR' }
                      ].map((m) => (
                        <button
                          key={m.id}
                          onClick={() => {
                            setMotionMode(m.id);
                            setIsPlaying(true);
                          }}
                          className={`py-2 px-1 rounded-xl border text-[11px] font-semibold min-h-[44px] ${
                            motionMode === m.id
                              ? 'bg-sky-500 text-slate-950 font-bold border-sky-400'
                              : 'bg-slate-900/70 border-slate-800 text-slate-300'
                          }`}
                        >
                          {m.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="p-3 rounded-xl bg-slate-900/80 border border-slate-800 space-y-2.5">
                    <div className="text-[11px] font-bold text-slate-200">Impingement-Free ROM: Pre-Op CTA vs. Post-Op RSA</div>
                    {[
                      { label: 'Scapular Abduction', pre: biomech.preOpLimits.abduction, post: biomech.maxAbduction, max: 160 },
                      { label: 'Adduction (Notch Clearance)', pre: biomech.preOpLimits.adduction, post: biomech.maxAdduction, max: 40 },
                      { label: 'External Rotation (0° Abd)', pre: biomech.preOpLimits.er0, post: biomech.maxER0, max: 80 },
                      { label: 'External Rotation (90° Abd)', pre: biomech.preOpLimits.er90, post: biomech.maxER90, max: 100 },
                      { label: 'Internal Rotation', pre: biomech.preOpLimits.ir, post: biomech.maxIR, max: 90 }
                    ].map((row) => (
                      <div key={row.label}>
                        <div className="flex justify-between text-[11px] mb-1">
                          <span className="text-slate-300">{row.label}</span>
                          <span>
                            <span className="text-slate-500 mr-2">Pre: {row.pre}°</span>
                            <span className="text-sky-300 font-bold">RSA: {row.post}°</span>
                          </span>
                        </div>
                        <div className="h-2 rounded-full bg-slate-800 overflow-hidden relative">
                          <div
                            className="h-full bg-sky-400 rounded-full transition-all"
                            style={{ width: `${Math.min(100, (row.post / row.max) * 100)}%` }}
                          />
                          <div
                            className="absolute top-0 bottom-0 w-0.5 bg-amber-400"
                            style={{ left: `${Math.min(100, (row.pre / row.max) * 100)}%` }}
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>

            {/* Persistent 7-Axis Construct Trade-Off Footer Strip */}
            <div className="p-2.5 bg-[#080D18] border-t border-slate-800 grid grid-cols-4 gap-1.5 shrink-0">
              <div className="p-1.5 rounded-lg bg-slate-900/90 border border-slate-800/80 text-center">
                <div className="text-[9px] uppercase text-slate-400">Notch Risk</div>
                <div className={`text-xs font-bold ${
                  biomech.notchRisk === 'HIGH' ? 'text-rose-400' : biomech.notchRisk === 'MODERATE' ? 'text-amber-300' : 'text-emerald-400'
                }`}>
                  {biomech.notchRisk}
                </div>
              </div>

              <div className="p-1.5 rounded-lg bg-slate-900/90 border border-slate-800/80 text-center">
                <div className="text-[9px] uppercase text-slate-400">Global Lat</div>
                <div className="text-xs font-bold text-sky-300">+{biomech.totalLatMm}mm</div>
              </div>

              <div className="p-1.5 rounded-lg bg-slate-900/90 border border-slate-800/80 text-center">
                <div className="text-[9px] uppercase text-slate-400">Deltoid</div>
                <div className={`text-xs font-bold ${biomech.acromialStress === 'ELEVATED' ? 'text-amber-300' : 'text-emerald-300'}`}>
                  {biomech.deltoidTensionPct}%
                </div>
              </div>

              <div className="p-1.5 rounded-lg bg-slate-900/90 border border-slate-800/80 text-center">
                <div className="text-[9px] uppercase text-slate-400">Bone / Fix</div>
                <div className="text-xs font-bold text-slate-200">
                  {biomech.bonePreservedPct}% • {biomech.fixationConfidence[0]}
                </div>
              </div>
            </div>

          </section>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
